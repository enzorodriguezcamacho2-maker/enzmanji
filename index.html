<script id="ai-profile-js">
/* ai-profile.js — Perfil de gustos del grupo. Acumula las reacciones de cada partida (👍/👎, aciertos, pases,
   tiempos agotados, encuesta final), separadas por modo Infantil / Adulto, y las convierte en frases cortas que
   la IA recibe al generar contenido en la partida siguiente.
   · Es anónimo y del GRUPO: no guarda nombres ni datos personales.
   · Olvida poco a poco (decay) para que el perfil siga a la gente, no a lo que pasó hace meses.
   · Sin dependencias: se prueba en Node y se incrusta en la página. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(); else (root.TE = root.TE || {}).AIProfile = factory();
})(typeof window !== 'undefined' ? window : globalThis, function () {
  'use strict';
  const CATS = { cultura: 'cultura general', historia: 'historia', geo: 'geografía', ciencia: 'ciencia', cine: 'cine y series', ocio: 'entretenimiento', acertijo: 'acertijos', rapidez: 'rapidez' };
  const KINDS = { choice: 'preguntas de opciones', open: 'preguntas de respuesta escrita', riddle: 'acertijos', speed: 'retos de rapidez', memory: 'memoria', draw: 'dibujo', collective: 'retos de grupo', arcano: 'Cartas de Arcano' };
  const FAV = { preguntas: 'las preguntas', arcano: 'las Cartas de Arcano', grupo: 'los retos de grupo', dibujo: 'dibujo y memoria', votos: 'las votaciones' };
  const OUT = ['ok', 'fail', 'timeout', 'pass'];
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const B = () => ({ n: 0, up: 0, down: 0, ok: 0, fail: 0, timeout: 0, pass: 0, rS: 0, rN: 0 });
  const M = () => ({ cat: {}, kind: {}, diff: {}, src: { ai: B(), orig: B() }, fav: {}, feel: { easy: 0, ok: 0, hard: 0 }, summary: '', sumGames: 0 });
  const empty = () => ({ v: 1, games: 0, kids: M(), adult: M() });
  const mode = ev => (ev && ev.mode === 'kids' ? 'kids' : 'adult');
  const bucket = (o, k) => (has(o, k) ? o[k] : (o[k] = B()));

  /* Normaliza lo que venga del almacenamiento: nunca confía en su forma. */
  function sanitize(p) {
    const out = empty(); if (!p || typeof p !== 'object') return out;
    out.games = Math.max(0, Math.min(9999, Number(p.games) || 0));
    ['kids', 'adult'].forEach(md => {
      const src = p[md]; if (!src || typeof src !== 'object') return;
      const num = x => { const v = Number(x); return Number.isFinite(v) && v >= 0 && v < 1e6 ? v : 0; };
      const copyB = b => { const r = B(); if (b && typeof b === 'object') Object.keys(r).forEach(k => { r[k] = num(b[k]); }); return r; };
      Object.keys(CATS).forEach(k => { if (src.cat && has(src.cat, k)) out[md].cat[k] = copyB(src.cat[k]); });
      Object.keys(KINDS).forEach(k => { if (src.kind && has(src.kind, k)) out[md].kind[k] = copyB(src.kind[k]); });
      ['d1', 'd2', 'd3'].forEach(k => { if (src.diff && has(src.diff, k)) out[md].diff[k] = copyB(src.diff[k]); });
      if (src.src) { out[md].src.ai = copyB(src.src.ai); out[md].src.orig = copyB(src.src.orig); }
      Object.keys(FAV).forEach(k => { if (src.fav && has(src.fav, k)) out[md].fav[k] = num(src.fav[k]); });
      ['easy', 'ok', 'hard'].forEach(k => { if (src.feel) out[md].feel[k] = num(src.feel[k]); });
      out[md].summary = typeof src.summary === 'string' ? src.summary.replace(/[<>]/g, ' ').slice(0, 450) : '';
      out[md].sumGames = num(src.sumGames);
    });
    return out;
  }

  function targets(m, ev) {
    const t = [];
    if (ev.cat && has(CATS, ev.cat)) t.push(bucket(m.cat, ev.cat));
    if (ev.kind && has(KINDS, ev.kind)) t.push(bucket(m.kind, ev.kind));
    if (ev.diff >= 1 && ev.diff <= 3) t.push(bucket(m.diff, 'd' + Math.round(ev.diff)));
    t.push(m.src[ev.ai ? 'ai' : 'orig']);
    return t;
  }
  /* Incorpora un suceso del registro del motor (item / vote / survey). */
  function merge(p, ev) {
    if (!ev || typeof ev !== 'object') return p;
    const m = p[mode(ev)];
    if (ev.k === 'item') {
      targets(m, ev).forEach(b => {
        b.n++; if (OUT.indexOf(ev.outcome) >= 0) b[ev.outcome]++;
        if (ev.outcome === 'ok' && Number(ev.ms) >= 0 && Number(ev.total) > 0) { b.rS += Math.min(1, ev.ms / ev.total); b.rN++; }
      });
    } else if (ev.k === 'vote') {
      if (ev.v !== 1 && ev.v !== -1) return p;
      targets(m, ev).forEach(b => { if (ev.v > 0) b.up++; else b.down++; });
    } else if (ev.k === 'survey') {
      if (has(FAV, ev.fav)) m.fav[ev.fav] = (m.fav[ev.fav] || 0) + 1;
      if (ev.diff === 'easy' || ev.diff === 'ok' || ev.diff === 'hard') m.feel[ev.diff]++;
    }
    return p;
  }
  /* Olvido gradual: al empezar una partida nueva el pasado pesa un poco menos. */
  function decay(p, f) {
    f = f == null ? 0.85 : f;
    const dB = b => { Object.keys(b).forEach(k => { b[k] *= f; }); };
    ['kids', 'adult'].forEach(md => { const m = p[md]; [m.cat, m.kind, m.diff].forEach(g => Object.keys(g).forEach(k => dB(g[k]))); dB(m.src.ai); dB(m.src.orig); Object.keys(m.fav).forEach(k => { m.fav[k] *= f; }); Object.keys(m.feel).forEach(k => { m.feel[k] *= f; }); });
    return p;
  }

  const votes = b => b.up + b.down, like = b => (b.up + 1) / (b.up + b.down + 2);
  const played = b => b.ok + b.fail + b.timeout + b.pass, okRate = b => (played(b) ? b.ok / played(b) : 0), skipRate = b => (b.n ? (b.pass + b.timeout) / b.n : 0);
  const names = (keys, dict) => keys.map(k => dict[k] || k).join(', ');
  const rank = (grp, pick, fn) => Object.keys(grp).filter(k => pick(grp[k])).sort((a, b) => fn(grp[b]) - fn(grp[a]));
  const items = m => Object.keys(m.kind).reduce((s, k) => s + m.kind[k].n, 0);
  const nVotes = m => Object.keys(m.kind).reduce((s, k) => s + votes(m.kind[k]), 0);

  /* Frases deterministas (siempre disponibles, sin IA) sobre lo que se ha observado. */
  function text(p, md) {
    const m = p[md === 'kids' ? 'kids' : 'adult'], L = [];
    const likeC = rank(m.cat, b => votes(b) >= 3 && like(b) >= 0.65, like).slice(0, 3), disC = rank(m.cat, b => votes(b) >= 3 && like(b) <= 0.35, b => -like(b)).slice(0, 3);
    if (likeC.length) L.push('Les gustan las preguntas de ' + names(likeC, CATS) + '.');
    if (disC.length) L.push('No les gustan las de ' + names(disC, CATS) + '.');
    const likeK = rank(m.kind, b => votes(b) >= 3 && like(b) >= 0.65, like).slice(0, 3), disK = rank(m.kind, b => votes(b) >= 3 && like(b) <= 0.35, b => -like(b)).slice(0, 3);
    if (likeK.length) L.push('Aprecian: ' + names(likeK, KINDS) + '.');
    if (disK.length) L.push('Valoran mal: ' + names(disK, KINDS) + '.');
    const skipK = rank(m.kind, b => b.n >= 4 && skipRate(b) >= 0.4, skipRate).slice(0, 2), skipC = rank(m.cat, b => b.n >= 4 && skipRate(b) >= 0.4, skipRate).slice(0, 2);
    if (skipK.length || skipC.length) L.push('Suelen pasar o quedarse sin tiempo en: ' + names(skipK, KINDS) + (skipK.length && skipC.length ? '; ' : '') + (skipC.length ? 'temas de ' + names(skipC, CATS) : '') + '.');
    const d1 = m.diff.d1, d3 = m.diff.d3;
    if (d1 && played(d1) >= 5 && okRate(d1) >= 0.85) L.push('Las preguntas fáciles se aciertan casi siempre: conviene subir la dificultad.');
    if (d3 && played(d3) >= 4 && okRate(d3) <= 0.3) L.push('Las difíciles casi nunca se aciertan: evitar las muy difíciles.');
    const f = m.feel, tf = f.easy + f.ok + f.hard;
    if (tf >= 2) { if (f.hard / tf >= 0.5) L.push('En la encuesta dicen que el juego es difícil.'); else if (f.easy / tf >= 0.5) L.push('En la encuesta dicen que el juego es fácil.'); }
    const a = m.src.ai, o = m.src.orig;
    if (votes(a) >= 4 && votes(o) >= 4) { const d = like(a) - like(o); if (d >= 0.2) L.push('Las preguntas nuevas generadas por IA gustan más que las originales.'); else if (d <= -0.2) L.push('Las preguntas nuevas generadas por IA gustan menos que las originales.'); }
    const fav = Object.keys(m.fav).filter(k => m.fav[k] >= 1.5).sort((x, y) => m.fav[y] - m.fav[x]).slice(0, 2);
    if (fav.length) L.push('Lo que más disfrutan: ' + names(fav, FAV) + '.');
    return L.join(' ');
  }
  /* Cifras sueltas para que la IA matice al resumir. */
  function raw(p, md) {
    const m = p[md === 'kids' ? 'kids' : 'adult'], r = x => Math.round(x * 10) / 10, parts = [];
    const fmt = (grp, dict) => Object.keys(grp).filter(k => grp[k].n >= 2 || votes(grp[k]) >= 1).sort((a, b) => grp[b].n - grp[a].n).slice(0, 6).map(k => (dict[k] || k) + ' ' + r(grp[k].up) + ' a favor/' + r(grp[k].down) + ' en contra, acierta ' + Math.round(okRate(grp[k]) * 100) + '%, pasa/tiempo ' + Math.round(skipRate(grp[k]) * 100) + '%').join('; ');
    const c = fmt(m.cat, CATS), k = fmt(m.kind, KINDS); if (c) parts.push('Por tema: ' + c + '.'); if (k) parts.push('Por tipo: ' + k + '.');
    return parts.join(' ');
  }
  const enough = (p, md) => items(p[md === 'kids' ? 'kids' : 'adult']) >= 6;
  /* Texto que se envía a la IA al pedir contenido: su resumen guardado + los hechos recientes. */
  function prefs(p, md) {
    const m = p[md === 'kids' ? 'kids' : 'adult'], det = text(p, md);
    return ((m.summary ? m.summary + ' ' : '') + det).trim().slice(0, 700);
  }
  /* Texto de entrada para la tarea «learn» (la IA lo resume en un perfil). */
  function stats(p, md) { return (text(p, md) + ' ' + raw(p, md) + ' Partidas con datos: ' + Math.round(p.games) + '.').trim().slice(0, 1100); }
  function setSummary(p, md, t) { const m = p[md === 'kids' ? 'kids' : 'adult']; m.summary = String(t || '').replace(/[<>]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 450); m.sumGames = p.games; return p; }

  return { empty, sanitize, merge, decay, text, raw, prefs, stats, enough, setSummary, CATS, KINDS, FAV };
});

</script>
<script id="ai-panel-js">
/* ==========================================================================
   ai-panel.js — «Ajustes de IA» en la TV: estado, clave, contador de uso, interruptores,

(function () {
  'use strict';
  const TE = (window.TE = window.TE || {});
  if (TE.phoneMode) return;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SW = [

  const MODE = [['kids', 'Infantil'], ['adult', 'Adulto']];
  let el = null, timer = 0;

  document.head.appendChild(css);

  const API = () => TE.ai;
  const fmtT = ms => { try { return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  const fmtLeft = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; };
  const STATUS = { on: ['🟢', 'Conectada'], idle: ['🟡', 'Comprobando…'], nokey: ['⚪', 'Sin clave'], off: ['⚪', 'Sin clave'], down: ['🔴', 'Sin conexión'], limit: ['🟠', 'Límite alcanzado'] };

  function meter(ai) {

<script id="ai-js">
/* ==========================================================================
   ai.js — IA en la pantalla principal (TV).

   Qué hace:

     · «Cartas de Arcano»: sucesos sorpresa con efectos de una lista cerrada
     · revisión/corrección de las preguntas que crean los jugadores
     · crónica final de la partida
     · APRENDE de las reacciones del grupo (👍/👎, pases, fallos, encuesta final), lo guarda en este

  const pacificDay = ms => new Date(ms).toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });

            if (P.bet === 'contra') yes = !(lead && tg && lead.id === tg.id) && r() < .4;
            if (P.bet === 'pro') yes = r() < .75;
            if (P.bet === 'smart') yes = tg && !tg.bot ? r() < .6 : r() < .5;
            act(b.id, { type: 'jBet', pick: yes ? 'yes' : 'no' });
          });
        }
        const F = A && A.flash;
        if (F && !F.done && A.target !== b.id && (F.answers || {})[b.id] === undefined) once('fl:' + F.id + ':' + b.id, 1500 + r() * 4000, () => act(b.id, { type: 'jFlash', i: Math.floor(r() * (F.options || [1]).length) }));
        if (E && !E.done && (E.resp || {})[b.id] === undefined) {
          once('ev:' + E.id + ':' + b.id, 1200 + r() * 4500, () => {
            let v = 0;
            if (E.kind === 'treasure') v = 1;
            else if (E.kind === 'social') { const others = st.players.filter(p => p.id !== b.id); v = (P.bet === 'contra' ? leader(b.id) : pick(r, others) || {}).id; }
            else v = Math.floor(r() * ((E.options || [1]).length));
            act(b.id, { type: 'jEvent', v });
          });
        }
      });
    }
    function impostor(st, list) {
      const I = st.imp; if (!I) return; const V = I.vote;
      list.forEach(b => {
        const role = roleOf(b.id), P = PERS[b.bot.pers];
        if (V && !V.done && !(V.voted || {})[b.id]) {
          once('iv:' + V.id + ':' + b.id, 1500 + r() * 5000, () => {
            const others = st.players.filter(p => p.id !== b.id && !(role === 'helper' && p.id === I.impId));
            let tg;
            if (role === 'impostor' || role === 'helper') tg = pick(r, others.filter(p => p.id !== I.impId));      // nunca se delata
            else if (b.bot.pers === 'listo' && r() < .55) tg = others.find(p => p.id === I.impId) || pick(r, others);  // el listo a veces lo deduce
            else if (b.bot.pers === 'sospecha') tg = leader(b.id);
            else tg = pick(r, others);
            if (!tg) return;
            const res = act(b.id, { type: 'impVote', target: tg.id, nid: nid() });
            if (res && res.ok !== false) say(b, 'vote', tg.name, 'vota en la votación del impostor y sospecha de ' + tg.name);
          });
        }
        // trampas del impostor/ayudante: de vez en cuando, en turno ajeno, contra el que va primero
        if ((role === 'impostor' || role === 'helper') && st.turn && st.turn.playerId !== b.id && st.round >= (I.lockUntilRound || 0) && I.lastTrapTurn !== st.turn.number && (I.charges || 0) > 0) {
          once('trap:' + st.turn.number + ':' + b.id, 2500 + r() * 4000, () => {
            if (r() > P.trap * .45) return;
            const tg = leader(b.id); if (!tg || tg.id === I.impId) return;
            act(b.id, { type: 'impTrap', target: tg.id, trap: pick(r, ['slow', 'fog', 'luck']), nid: nid() });
          });
        }
      });
    }

    /* ------------------------------ chat ------------------------------ */
    const fill = (s, n) => String(s).replace(/\{n\}/g, n || 'alguien');
    function ctx() {                                          // contexto resumido para la IA (barato)
      const st = S(), goal = (st.cfg && st.cfg.goalDistance) || 72;
      const rank = st.players.slice().sort((a, b) => b.dist - a.dist).slice(0, 5).map(p => p.name + ' casilla ' + p.dist + '/' + goal + ', ' + p.coins + ' monedas');
      return rank.concat((st.log || []).slice(-4).map(l => l.msg));
    }
    const mode = () => { const st = S(); return st.jungle && st.jungle.mode === 'kids' ? 'kids' : 'adult'; };
    /* Un bot dice algo: con IA si hay presupuesto y la ocasión lo merece; si no, su frase de repertorio. */
    function say(b, kind, name, event, force) {
      const t = now(), P = PERS[b.bot.pers];
      if (!force) {
        if (t - last.any < 3500 || t - (last.per[b.id] || 0) < 9000) return false;
        if (r() > P.talk) return false;
      }
      last.any = t; last.per[b.id] = t;
      const fallback = fill(pick(r, (L[kind] && L[kind][b.bot.pers]) || L.reply[b.bot.pers]), name);
      const post = text => act('host', { type: 'chat', as: b.id, text });
      const useAI = ai && ai.chatLine && t - last.aiAt > 15000 && last.aiN < 30 && (force || r() < .45);
      if (!useAI) { setTimeout(() => post(fallback), 500 + r() * 900); return true; }
      last.aiAt = t; last.aiN++;
      const st = S();
      Promise.resolve(ai.chatLine({ name: b.name, pers: P.desc, mode: mode(), event, ctx: ctx(), chat: (st.chat || []).slice(-6).map(m => m.name + ': ' + m.text) }))
        .then(x => post(x && x.length > 2 ? x.replace(/^["«]|["»]$/g, '').slice(0, 140) : fallback)).catch(() => post(fallback));
      return true;
    }
    const someBot = (filter) => { const l = bots().filter(filter || (() => true)); return l.length ? pick(r, l) : null; };
    function talk() {
      const st = S(); if (!st) return; const list = bots(); if (!list.length) return;
      if (st.phase !== last.phase) {
        if (st.phase === 'playing' && last.phase !== 'playing') { last.near = {}; last.aiN = 0; const b = someBot(); if (b) say(b, 'start', '', 'empieza la partida', true); }
        if (st.phase === 'ended') { const w = st.players.find(p => p.id === st.winnerId); const b = someBot(x => !w || x.id !== w.id); if (b && w) say(b, 'win', w.name, w.name + ' ha ganado la partida', true); }
        last.phase = st.phase;
      }
      // sucesos del registro
      const fresh = (st.log || []).filter(l => l.s > last.log); if (fresh.length) last.log = fresh[fresh.length - 1].s;
      fresh.slice(-2).forEach(l => {
        const who = st.players.find(p => l.msg.indexOf(p.name) >= 0), m = l.msg;
        let kind = null;
        if (/falla|sin tiempo|Fallaste/.test(m)) kind = 'fail';
        else if (/supera|acierta|gana el reto|consigue/.test(m) && l.kind === 'good') kind = 'ok';
        else if (l.kind === 'curse' || /maldici/i.test(m)) kind = 'curse';
        else if (l.kind === 'avalanche' || /Avalancha/.test(m)) kind = 'aval';
        else if (l.kind === 'chaos') kind = 'chaos';
        else if (l.kind === 'good' && /🪙|moneda/.test(m)) kind = 'coins';
        else if (l.kind === 'turn' && who && who.bot) kind = 'myturn';
        if (!kind) return;
        let b, k = kind;
        if ((kind === 'ok' || kind === 'fail') && who && who.bot && r() < .6) { b = who; k = kind === 'ok' ? 'okSelf' : 'failSelf'; }
        else if (kind === 'myturn') { b = who; }
        else { b = someBot(x => !who || x.id !== who.id); k = kind === 'ok' ? 'okOther' : kind === 'fail' ? 'failOther' : kind; }
        if (b) say(b, k, who ? who.name : '', m);
      });
      // alguien cerca de la meta
      const goal = (st.cfg && st.cfg.goalDistance) || 72;
      st.players.forEach(p => { if (st.phase === 'playing' && p.dist >= goal - 10 && !last.near[p.id]) { last.near[p.id] = true; const b = someBot(x => x.id !== p.id); if (b) say(b, 'near', p.name, p.name + ' está muy cerca de la meta'); } });
      // respuestas a personas que escriben en el chat
      const msgs = (st.chat || []).filter(m => m.s > last.chat); if (msgs.length) last.chat = msgs[msgs.length - 1].s;
      msgs.forEach(m => {
        const from = st.players.find(p => p.id === m.pid); if (from && from.bot) return;   // los bots no se contestan entre ellos en bucle
        const low = m.text.toLowerCase();
        let b = list.find(x => low.indexOf(x.name.toLowerCase().split(' ')[0]) >= 0);
        const accuse = /impostor|tramp|sospech|culpa|has sido/.test(low);
        if (!b && (m.text.indexOf('?') >= 0 || accuse || r() < .45)) b = pick(r, list);
        if (!b) return;
        const kind = accuse && low.indexOf(b.name.toLowerCase().split(' ')[0]) >= 0 ? 'accused' : 'reply';
        setTimeout(() => say(b, kind, m.name, m.name + ' ha escrito en el chat: «' + m.text + '». Respóndele', true), 600 + r() * 1400);
      });
    }

    function tick() { try { play(); } catch (e) { if (o.onError) o.onError(e); } try { talk(); } catch (e) { if (o.onError) o.onError(e); } }
    return { tick, PERS, _say: say };
  }

  /* ------------------------------ enganche en el navegador (solo la TV) ------------------------------ */
  function attach() {
    if (typeof window === 'undefined' || (window.TE && window.TE.phoneMode)) return;
    const w = setInterval(() => {
      const TE = window.TE, app = TE && TE.app; if (!app || !app.engine) return; clearInterval(w);
      const bots = create({ engine: app.engine, ai: { chatLine: p => (TE.ai && TE.ai.chatLine ? TE.ai.chatLine(p) : null) }, onError: e => console.error(e) });
      TE.bots = bots;
      let q = false; app.engine.subscribe(() => { if (q) return; q = true; setTimeout(() => { q = false; bots.tick(); }, 120); });
      setInterval(() => bots.tick(), 300);
    }, 300);
  }
  attach();
  return { create, PERS, LINES: L };
});

</script>
<script id="chat-ui-js">
/* ==========================================================================
   chat-ui.js — Chat de la partida en la TV y en los móviles.
   Los mensajes viven en el estado compartido de la partida (state.chat), que ya llega a todos los

   · TV: pestaña «Chat» junto a la Crónica (con campo para escribir) + bocadillos sobre el tablero.
   · Móvil: botón flotante, panel desde abajo que no tapa los controles mientras está cerrado,

(function () {
  'use strict';
  const TE = (window.TE = window.TE || {});

  const BUBBLE = '<svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true"><path d="M4 4.5h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-4.5 3.6c-.5.4-1.2 0-1.2-.6v-3H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="currentColor"/><circle cx="8" cy="11" r="1.4" fill="#173a2c"/><circle cx="12" cy="11" r="1.4" fill="#173a2c"/><circle cx="16" cy="11" r="1.4" fill="#173a2c"/></svg>';
  const fmt = t => { try { return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  function msgHTML(m, me) {
    return '<li class="cm' + (m.pid === me ? ' mine' : '') + (m.bot ? ' bot' : '') + (m.pid === 'tv' ? ' tv' : '') + '" style="--pc:' + esc(m.color || '#e0b04a') + '">' +
      '<span class="cm-av">' + (m.avatar || '') + '</span><div class="cm-b"><div class="cm-h"><b>' + esc(m.name) + '</b>' + (m.bot ? '<em>BOT · ' + esc(m.bot) + '</em>' : '') + '<time>' + fmt(m.t) + '</time></div><p>' + esc(m.text) + '</p></div></li>';
  }

  const css = document.createElement('style'); css.id = 'chat-css';
  css.textContent = `
/* --- TV: pestañas Crónica / Chat en el pergamino --- */
.lg-tabs { display: flex; gap: 6px; margin: 0 0 8px; border-bottom: 2px solid rgba(90,55,15,.3); }

/* --- TV: bocadillos sobre el tablero --- */

  box-shadow: 0 10px 26px rgba(0,0,0,.5); color: #eaf2e6; animation: bub-in .35s cubic-bezier(.2,1.4,.4,1); will-change: transform, opacity; }

/* --- móvil --- */
.chat-fab { position: absolute; left: .7em; bottom: 5.4em; z-index: 25; width: 3.2em; height: 3.2em; border-radius: 50%; border: 2px solid #e0b04a; background: linear-gradient(180deg, #2a5a44, #12301f);
  color: #ffe2a0; font-size: 1em; display: grid; place-items: center; box-shadow: 0 .4em 1em rgba(0,0,0,.5); cursor: pointer; touch-action: manipulation; }

.chat-fab .n { position: absolute; top: -.35em; right: -.35em; min-width: 1.5em; height: 1.5em; padding: 0 .35em; border-radius: 999px; background: #e63946; color: #fff; font: 800 .75em/1.5em system-ui; text-align: center; }
.chat-fab .n:empty { display: none; }
.chat-peek { position: absolute; left: 4.4em; right: .7em; bottom: 5.6em; z-index: 24; padding: .45em .8em; border-radius: 1em 1em 1em .3em; background: rgba(10,24,18,.96); border: 1px solid var(--pc, #e0b04a);
  color: #eaf2e6; font-size: .85em; box-shadow: 0 .4em 1em rgba(0,0,0,.5); animation: bub-in .3s ease-out; pointer-events: none; }
.chat-peek b { color: var(--pc, #ffe2a0); }
.chat-sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 72%; z-index: 40; display: flex; flex-direction: column; border-radius: 1.4em 1.4em 0 0; background: linear-gradient(180deg, #f1e0b4, #dcc289);
  box-shadow: 0 -1em 2em rgba(0,0,0,.55); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.3,1); }

.chat-sheet .cm-av { width: 2.2em; height: 2.2em; font-size: 1.4em; } .chat-sheet .cm-av .an { width: 1.8em; height: 1.8em; }
.chat-sheet .cm-h { font-size: .8em; } .chat-sheet .cm p { font-size: .95em; }
.chat-sheet .cm.mine .cm-b { background: rgba(255,255,255,.45); border-radius: .8em; padding: .2em .5em; }
.chat-sheet .chat-form { padding: .5em .7em .8em; margin: 0; }

.chat-sheet .chat-form button { font-size: .95em; }`;
  document.head.appendChild(css);

  /* ------------------------------ TV ------------------------------ */
  function attachTV() {
    if (TE.phoneMode) return;
    const w = setInterval(() => {
      const app = TE.app, box = document.querySelector('#side .logbox'), cam = document.getElementById('cam');
      if (!app || !box || !cam) return; clearInterval(w);
      const h3 = box.querySelector('h3');
      const tabs = document.createElement('div'); tabs.className = 'lg-tabs';
      tabs.innerHTML = '<button type="button" data-lt="log" class="on">Crónica</button><button type="button" data-lt="chat">Chat <i class="lg-un"></i></button>';
      if (h3) h3.replaceWith(tabs); else box.prepend(tabs);
      const chat = document.createElement('div'); chat.className = 'chatbox'; chat.hidden = true;
      chat.innerHTML = '<ul class="chat-list"><li class="chat-empty">Aún no hay mensajes. Los bots hablarán cuando pase algo.</li></ul><form class="chat-form" autocomplete="off"><input maxlength="140" placeholder="Escribe en el chat de la partida…" aria-label="Mensaje"><button type="submit">Enviar</button></form>';
      box.appendChild(chat);

      const bubbles = document.createElement('div'); bubbles.id = 'chat-bubbles'; cam.appendChild(bubbles);
      let tab = 'log', seen = 0, unread = 0, first = true;
      tabs.addEventListener('click', ev => {
        const b = ev.target.closest('[data-lt]'); if (!b) return; tab = b.dataset.lt;
        tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        log.style.display = tab === 'log' ? '' : 'none'; chat.hidden = tab !== 'chat';
        if (tab === 'chat') { unread = 0; un.textContent = ''; list.scrollTop = list.scrollHeight; }
      });
      chat.querySelector('form').addEventListener('submit', ev => {
        ev.preventDefault(); const inp = chat.querySelector('input'), text = inp.value.trim(); if (!text) return;
        const r = app.engine.dispatch('host', { type: 'chat', text }); if (r && r.ok) inp.value = '';
      });
      function bubble(m) {
        const d = document.createElement('div'); d.className = 'chat-bub'; d.style.setProperty('--pc', m.color || '#e0b04a');
        d.innerHTML = '<span class="cm-av">' + (m.avatar || '') + '</span><div><b>' + esc(m.name) + '</b>' + (m.bot ? '<em>BOT</em>' : '') + '<p>' + esc(m.text) + '</p></div>';
        bubbles.appendChild(d); while (bubbles.children.length > 3) bubbles.firstChild.remove();
        setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 460); }, 6500);
      }
      function render() {
        const v = app.engine.getView('tv'), msgs = (v && v.chat) || [];
        const top = msgs.length ? msgs[msgs.length - 1].s : 0; if (top === seen) return;
        const fresh = msgs.filter(m => m.s > seen);
        if (seen === 0 || fresh.length > 12) list.innerHTML = msgs.map(m => msgHTML(m, 'tv')).join('') || '';
        else { const e0 = list.querySelector('.chat-empty'); if (e0) e0.remove(); list.insertAdjacentHTML('beforeend', fresh.map(m => msgHTML(m, 'tv')).join('')); while (list.children.length > 40) list.firstChild.remove(); }
        seen = top; list.scrollTop = list.scrollHeight;

      }
      let q = false; app.engine.subscribe(() => { if (q) return; q = true; requestAnimationFrame(() => { q = false; try { render(); } catch (e) { console.error(e); } }); });
      render();
      // jugadores compactos cuando sois muchos
      const pl = document.getElementById('players');
      const fit = () => { const n = pl.querySelectorAll('.pcard').length; pl.classList.toggle('many', n > 4); };
      new MutationObserver(fit).observe(pl, { childList: true }); fit();
    }, 300);
  }

  /* ------------------------------ móvil ------------------------------ */
  function attachPhone() {
    if (!TE.createPhone) return;
    const prev = TE.createPhone;
    TE.createPhone = function (root, pid, transport) {
      const api = prev.call(this, root, pid, transport);
      const fab = document.createElement('button'); fab.type = 'button'; fab.className = 'chat-fab'; fab.setAttribute('aria-label', 'Abrir el chat');
      fab.innerHTML = BUBBLE + '<span class="n"></span>';
      const sheet = document.createElement('section'); sheet.className = 'chat-sheet'; sheet.setAttribute('aria-label', 'Chat de la partida');
      sheet.innerHTML = '<header><span>Chat de la partida</span><button type="button" class="x" aria-label="Cerrar">✕</button></header><ul class="chat-list"><li class="chat-empty">Escribe algo: los bots te contestarán.</li></ul>' +
        '<form class="chat-form" autocomplete="off"><input maxlength="140" placeholder="Escribe un mensaje…" aria-label="Mensaje" enterkeyhint="send"><button type="submit">Enviar</button></form>';
      root.appendChild(fab); root.appendChild(sheet);
      const list = sheet.querySelector('.chat-list'), badge = fab.querySelector('.n');
      let seen = 0, unread = 0, open = false, peek = null, first = true;
      const setOpen = on => { open = on; sheet.classList.toggle('open', on); if (on) { unread = 0; badge.textContent = ''; list.scrollTop = list.scrollHeight; if (peek) { peek.remove(); peek = null; } } };
      fab.addEventListener('click', () => setOpen(!open));
      sheet.querySelector('.x').addEventListener('click', () => setOpen(false));
      sheet.querySelector('form').addEventListener('submit', ev => {
        ev.preventDefault(); const inp = sheet.querySelector('input'), text = inp.value.trim(); if (!text) return;
        let r; try { r = transport.dispatch(pid, { type: 'chat', text }); } catch (e) { return; }
        const fin = x => { if (x && x.ok === false) { if (api.flash) api.flash(x.error || 'No se pudo enviar.', 'err'); } else inp.value = ''; };
        if (r && r.then) r.then(fin).catch(() => {}); else fin(r);
      });
      function draw() {
        if (!root.isConnected) return;
        const v = transport.getView(pid); if (!v) return;
        const msgs = v.chat || [], top = msgs.length ? msgs[msgs.length - 1].s : 0; if (top === seen) return;
        const fresh = msgs.filter(m => m.s > seen);
        list.innerHTML = msgs.map(m => msgHTML(m, pid)).join('') || '<li class="chat-empty">Escribe algo: los bots te contestarán.</li>';
        seen = top; list.scrollTop = list.scrollHeight;
        const others = fresh.filter(m => m.pid !== pid);
        if (!first && !open && others.length) {
          unread += others.length; badge.textContent = unread > 9 ? '9+' : String(unread);
          const m = others[others.length - 1];
          if (peek) peek.remove(); peek = document.createElement('div'); peek.className = 'chat-peek'; peek.style.setProperty('--pc', m.color || '#e0b04a');
          peek.innerHTML = '<b>' + esc(m.name) + ':</b> ' + esc(m.text.length > 70 ? m.text.slice(0, 68) + '…' : m.text); root.appendChild(peek);
          const pk = peek; setTimeout(() => { if (pk.isConnected) pk.remove(); if (peek === pk) peek = null; }, 4000);
        }
        first = false;
      }
      const iv = setInterval(() => { if (!root.isConnected) clearInterval(iv); else try { draw(); } catch (e) { console.error(e); } }, 500);
      return api;
    };
  }
  attachPhone(); attachTV();
})();

</script>
<script id="theme-ui-js">
/* ==========================================================================
   theme-ui.js — Selector del TEMA de la partida en la TV.
   Se pueden marcar varios temas listos, escribir uno propio, o volver a «los de siempre».
   La IA ambienta preguntas, acertijos y Cartas de Arcano en ese tema (modo niños y adultos).
   ========================================================================== */
(function () {
  'use strict';
  const TE = (window.TE = window.TE || {}); if (TE.phoneMode) return;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const css = document.createElement('style'); css.id = 'theme-css';
  css.textContent = `
.theme-btn { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 18px; border: 2px solid #9b6bff; background: linear-gradient(90deg, rgba(155,107,255,.28), rgba(155,107,255,.08)); color: #efe6ff; font: 600 20px var(--font-ui); cursor: pointer; max-width: 92%; }
.theme-btn .th-l { color: #cbb6ff; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; flex: none; }
.theme-btn b { font-family: var(--font-display); font-size: 24px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.theme-btn i { font-style: normal; font-size: 15px; padding: 3px 12px; border-radius: 999px; background: #9b6bff; color: #fff; flex: none; }
#theme-pop { position: fixed; inset: 0; z-index: 9100; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }
#theme-pop[hidden] { display: none; }
#theme-pop .box { width: min(900px, 100%); max-height: 94vh; overflow: auto; background: #0e1830; color: #eef; border: 2px solid #9b6bff; border-radius: 22px; padding: 22px 26px; font: 600 17px/1.35 system-ui, sans-serif; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
#theme-pop h2 { margin: 0 0 4px; font-size: 1.6em; } #theme-pop .sub { color: #b9b4d8; font-weight: 500; margin: 0 0 12px; }
#theme-pop .grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 16px; }
#theme-pop .tch { font: inherit; padding: 10px 16px; border-radius: 999px; border: 2px solid rgba(255,255,255,.22); background: rgba(255,255,255,.07); color: inherit; cursor: pointer; }
#theme-pop .tch.on { background: #9b6bff; border-color: #c9b2ff; color: #fff; box-shadow: 0 0 16px rgba(155,107,255,.6); }
#theme-pop label { display: block; margin: 6px 0; } #theme-pop input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: #0a1124; color: #fff; }
#theme-pop .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
#theme-pop .row button { font: inherit; font-weight: 800; padding: 12px 20px; border-radius: 14px; border: 0; cursor: pointer; }
#theme-pop .ok { background: linear-gradient(180deg, #f3c653, #c58a1b); color: #2b1a02; } #theme-pop .plain { background: rgba(255,255,255,.12); color: #fff; }
#theme-pop .warn { margin-top: 12px; color: #ffd27a; font-weight: 600; } #theme-pop .warn:empty { display: none; }`;
  document.head.appendChild(css);

  let pop = null, sel = new Set();
  function view() { return TE.app && TE.app.engine && TE.app.engine.getView('tv'); }
  function open() {
    const v = view(); if (!v) return;
    if (!pop) build();
    sel = new Set((v.theme && v.theme.picks) || []);
    pop.querySelector('input').value = (v.theme && v.theme.custom) || '';
    const list = v.themes || [];
    pop.querySelector('.grid').innerHTML = list.map(t => '<button type="button" class="tch' + (sel.has(t.key) ? ' on' : '') + '" data-k="' + esc(t.key) + '">' + esc(t.label) + '</button>').join('');
    const aiOn = TE.ai && TE.ai.state && TE.ai.state.status === 'on';
    pop.querySelector('.warn').textContent = aiOn ? '' : 'Para que el tema funcione hace falta la IA activa (Ajustes → Ajustes de IA → pegar la clave de Gemini). Sin IA se juega con las preguntas de siempre.';
    pop.hidden = false;
  }
  function build() {
    pop = document.createElement('div'); pop.id = 'theme-pop'; pop.hidden = true; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', 'Tema de la partida');
    pop.innerHTML = '<div class="box"><h2>Tema de la partida</h2><p class="sub">La IA hará las preguntas, los acertijos y las Cartas de Arcano de este tema. Puedes marcar varios y también escribir el tuyo. Vale para niños y para adultos.</p>' +
      '<div class="grid"></div><label>O escribe tu propio tema</label><input maxlength="60" placeholder="Por ejemplo: unicornios, Harry Potter, fútbol, Minecraft…" aria-label="Tema propio">' +
      '<p class="warn"></p><div class="row"><button type="button" class="ok" data-a="ok">Aplicar tema</button><button type="button" class="plain" data-a="none">Los de siempre</button><button type="button" class="plain" data-a="close">Cancelar</button></div></div>';
    document.body.appendChild(pop);
    pop.addEventListener('click', ev => {
      if (ev.target === pop) { pop.hidden = true; return; }
      const c = ev.target.closest('.tch'); if (c) { const k = c.dataset.k; if (sel.has(k)) sel.delete(k); else if (sel.size < 5) sel.add(k); c.classList.toggle('on', sel.has(k)); return; }
      const b = ev.target.closest('[data-a]'); if (!b) return;
      const eng = TE.app && TE.app.engine; if (!eng) return;
      if (b.dataset.a === 'ok') { eng.dispatch('host', { type: 'setTheme', picks: [...sel], custom: pop.querySelector('input').value }); pop.hidden = true; }
      else if (b.dataset.a === 'none') { eng.dispatch('host', { type: 'setTheme', picks: [], custom: '' }); pop.hidden = true; }
      else pop.hidden = true;
    });
    pop.querySelector('input').addEventListener('keydown', ev => { if (ev.key === 'Enter') pop.querySelector('[data-a="ok"]').click(); if (ev.key === 'Escape') pop.hidden = true; });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && pop && !pop.hidden) pop.hidden = true; });
  }
  document.addEventListener('click', ev => { if (ev.target.closest && ev.target.closest('[data-theme-open]')) { ev.stopPropagation(); open(); } }, true);
  // botón también en Ajustes (para cambiar el tema con la partida empezada)
  const w = setInterval(() => {
    const p = document.getElementById('settings-pop'); if (!p || !TE.app) return; clearInterval(w);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small'; b.textContent = 'Tema de la partida'; b.setAttribute('data-theme-open', '1');
    b.addEventListener('click', () => { p.hidden = true; });
    p.appendChild(b);
  }, 300);
  TE.ThemeUI = { open };
})();

</script>
