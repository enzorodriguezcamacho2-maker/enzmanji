    api.apply = apply;
    api.setTitle = t => { el.querySelector('.fw-title').innerHTML = t; };
    api.show = function () {
      el.style.display = 'flex'; s.open = true; apply(); focus();
      if (opts.onShow) opts.onShow();
    };
    api.hide = function () { el.style.display = 'none'; s.open = false; };
    api.close = function () { api.hide(); if (opts.onClose) opts.onClose(); };
    api.isOpen = () => s.open;
    api.moveTo = (x, y) => { s.x = x; s.y = y; apply(); };
    api.resizeTo = (w, h) => { s.w = w; s.h = h; apply(); };

    api.toggleMin = function () { s.min = !s.min; apply(); };
    api.toggleMax = function () {
      if (s.max) { Object.assign(s, s.prev); s.max = false; s.min = false; }

        s.max = true; s.min = false;
        s.x = 6; s.y = 6; s.w = window.innerWidth - 12; s.h = window.innerHeight - 12;
      }
      apply(); focus();
    };

    el.addEventListener('pointerdown', focus, true);
    el.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', ev => {
      ev.stopPropagation();
      const a = b.dataset.w;
      if (a === 'min') api.toggleMin(); else if (a === 'max') api.toggleMax(); else api.close();
    }));
    bar.addEventListener('dblclick', ev => { if (!ev.target.closest('button')) api.toggleMax(); });

    function dragger(handle, onMove) {
      handle.addEventListener('pointerdown', ev => {
        if (ev.target.closest('button') || ev.button > 0) return;
        ev.preventDefault();
        const sx = ev.clientX, sy = ev.clientY, o = { x: s.x, y: s.y, w: s.w, h: s.h };
        handle.setPointerCapture(ev.pointerId);
        const mv = e => onMove(o, e.clientX - sx, e.clientY - sy);
        const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); };

      });
    }
    dragger(bar, (o, dx, dy) => { if (s.max) return; s.x = o.x + dx; s.y = o.y + dy; apply(); });
    dragger(grip, (o, dx, dy) => { if (s.max) return; s.w = o.w + dx; s.h = o.h + dy; apply(); });

    if (window.ResizeObserver && opts.onResize) {
      new ResizeObserver(() => opts.onResize(body.clientWidth, body.clientHeight)).observe(body);

    el.style.display = 'none';

    all.push(api);
    return api;
  }

  TE.FloatingWindow = FloatingWindow;
  TE.Windows = { all, bringAllToFront() { all.forEach(w => w.isOpen() && w.focus()); } };
})();

        if (pd.type === 'collective') {
          const done = pd.answered[pid];
          return '<div class="ph-card"><div class="ph-q-head"><span class="cat" style="--cat:#f97316">👥 Reto de grupo</span></div>' + timer(pd) + '<h2 class="q">' + esc(pd.q.text) + '</h2>' +
            (done ? '<p class="note">Respuesta enviada. Esperando al resto…</p>' : opts(pd, m.collective)) + '</div>';
        }
        if (pd.type === 'challenge') return screenChallenge(v, pd);
        if (pd.type === 'chaosIntro') return '<div class="ph-card chaos center"><div class="big">🌀</div><h2>¡MODO CAOS!</h2><p>Retos más difíciles, premios mayores y tienda rebajada hasta que se complete una vuelta.</p></div>';
        const who = U.playerById(v, pd.playerId);
        return '<div class="ph-card center"><div class="big">👀</div><h2>Mira la pantalla</h2><p>' + (who ? esc(who.name) + ' está jugando.' : 'Algo está pasando.') + '</p></div>';
      }
      if (m.roll) {
        return '<div class="ph-card center turn"><div class="big">' + p.avatar + '</div><h2>¡Es tu turno!</h2><p>Tira el dado para avanzar.</p><button type="button" class="btn huge go" data-act="roll">🎲 Tirar el dado</button>' +
          '<p class="tiny">Antes de tirar puedes usar objetos y cartas (Mochila) o comprar (Tienda).</p></div>';
      }
      const step = v.turn && v.turn.step;
      return '<div class="ph-card center"><div class="big">' + (turnP ? turnP.avatar : '⏳') + '</div><h2>Turno de ' + esc(turnP ? turnP.name : '…') + '</h2><p>' +
        (step === 'moving' ? 'Su ficha se está moviendo.' : step === 'ending' ? 'Pasando el turno…' : step === 'resolving' ? 'Resolviendo la casilla…' : 'Espera tu turno. Mira la pantalla principal.') + '</p></div>';
    }

    function screenChallenge(v, pd) {
      const m = v.me, q = pd.q, mine = pd.playerId === pid, who = U.playerById(v, pd.playerId);
      const head = '<div class="ph-q-head">' + U.catBadge(q) + U.diffDots(q.diff) + '<span class="rw">+' + (pd.status === 'avalanche' ? pd.avalancheReward : pd.reward) + ' 🪙</span></div>' +
        (pd.mods && pd.mods.length ? '<div class="mods">' + pd.mods.map(x => '<span class="mod">' + esc(x) + '</span>').join('') + '</div>' : '');
      if (pd.status === 'avalanche') {
        const banner = '<div class="aval-banner">🏔️ ¡AVALANCHA! <small>El primero que acierte gana</small></div>';
        if (pd.excluded.includes(pid)) return '<div class="ph-card">' + banner + '<p class="note">Pasaste esta pregunta. Los demás compiten por ella.</p>' + timer(pd) + '</div>';
        if (pd.eliminated.includes(pid)) return '<div class="ph-card">' + banner + '<p class="note bad">Fallaste: quedas fuera de esta pregunta.</p>' + timer(pd) + '</div>';
        return '<div class="ph-card">' + banner + head + timer(pd) + '<h2 class="q">' + esc(q.text) + '</h2>' + (q.type === 'choice' ? opts(pd, m.answer) : textForm(pd, m.answer, q)) + '</div>';
      }
      if (q.type === 'memory') {
        if (!mine) return '<div class="ph-card center"><div class="big">🧠</div><h2>Reto de memoria</h2><p>' + esc(who.name) + ' memoriza una secuencia. Mira la pantalla.</p></div>';
        if (pd.phase === 'show') return '<div class="ph-card center">' + head + '<h2>Memoriza la secuencia</h2><p>Aparece en la pantalla principal, símbolo a símbolo.</p>' + timer(pd) + '<div class="mem-seq-hint">' + q.seq.map(() => '❔').join(' ') + '</div></div>';
        return '<div class="ph-card">' + head + timer(pd) + '<h2 class="q">Repite la secuencia</h2><div class="mem-seq" id="mem-seq"></div>' +
          '<div class="mem-pad">' + q.symbols.map(s => '<button type="button" class="sym" data-act="mem" data-s="' + s + '">' + s + '</button>').join('') + '</div>' +
          '<div class="row2"><button type="button" class="btn ghost" data-act="memBack">⌫ Borrar</button><button type="button" class="btn good" data-act="memSend" id="mem-send" disabled>Enviar</button></div></div>';
      }
      if (q.type === 'draw') return screenDraw(v, pd, mine, who);
      if (!mine) return '<div class="ph-card center"><div class="big">' + (who ? who.avatar : '❓') + '</div><h2>' + esc(who.name) + ' responde</h2><p>' + esc(U.KIND_NAME[pd.kind]) + (D.CHOICE ? ' · ' : '') + 'Mira la pantalla.</p>' + timer(pd) +
        '<p class="tiny">Si pasa la pregunta, se activará la Avalancha y podrás competir.</p></div>';
      return '<div class="ph-card">' + head + timer(pd) + '<h2 class="q">' + esc(q.text) + '</h2>' +
        (q.type === 'choice' ? opts(pd, m.answer) : textForm(pd, m.answer, q)) +
        '<div class="row2">' + hintBtn(v, pd) + (m.pass ? '<button type="button" class="btn warn" data-act="pass">🏔️ Pasar (Avalancha)</button>' : '') + '</div></div>';
    }
    function textForm(pd, allowed, q) {
      return (pd.hintText ? '<p class="note">💡 ' + esc(pd.hintText) + '</p>' : '') +
        '<form class="ph-form" data-form="answer"><input class="txt" type="text" autocomplete="off" autocapitalize="off" placeholder="Tu respuesta (' + q.length + ' letras)"' + (allowed ? '' : ' disabled') + ' aria-label="Tu respuesta"><button class="btn good" type="submit"' + (allowed ? '' : ' disabled') + '>Responder</button></form>';
    }

    function screenDraw(v, pd, mine, who) {
      const m = v.me;
      if (mine && pd.phase === 'draw') {
        return '<div class="ph-card draw"><div class="secret">Dibuja: <b>' + esc(pd.myWord) + '</b></div>' + timer(pd) +
          '<canvas class="ph-canvas" id="ph-canvas" width="600" height="600"></canvas>' +
          '<div class="tools"><div class="colors">' + COLORS.map(c => '<button type="button" class="col' + (c === dr.color && !dr.eraser ? ' sel' : '') + '" data-act="color" data-c="' + c + '" style="background:' + c + '" aria-label="Color ' + c + '"></button>').join('') + '</div>' +
          '<div class="row2"><label class="wlab">Grosor <input type="range" min="3" max="40" value="' + dr.width + '" data-act="width"></label>' +
          '<button type="button" class="btn small' + (dr.eraser ? ' sel' : '') + '" data-act="eraser">🧽 Goma</button></div>' +
          '<div class="row2"><button type="button" class="btn small ghost" data-act="undo">↶ Deshacer</button><button type="button" class="btn small good" data-act="drawFinish">✔ Terminar</button></div></div></div>';
      }
      if (mine) return '<div class="ph-card center"><div class="big">🎨</div><h2>Tu dibujo está en la pantalla</h2><p>Los demás intentan adivinarlo.</p>' + timer(pd) + '</div>';
      if (pd.phase === 'guess') {
        const left = D.SETTINGS.drawGuessMax - (pd.guesses[pid] || 0);
        return '<div class="ph-card"><h2>🎨 ¡Adivina el dibujo de ' + esc(who.name) + '!</h2>' + timer(pd) +
          (m.guess ? '<form class="ph-form" data-form="guess"><input class="txt" type="text" autocomplete="off" autocapitalize="off" placeholder="¿Qué es?" aria-label="Tu respuesta"><button class="btn good" type="submit">Probar (' + left + ' intentos)</button></form>'
            : '<p class="note bad">No te quedan intentos.</p>') + '</div>';
      }
      return '<div class="ph-card center"><div class="big">🎨</div><h2>' + esc(who.name) + ' está dibujando…</h2><p>Prepárate para adivinar.</p></div>';
    }

    function screenBag(v) {
      const m = v.me, p = me();
      let h = '<div class="ph-card"><h3>Objetos</h3>';
      const items = Object.keys(p.items);
      h += items.length ? items.map(k => {
        const def = D.SHOP_BY_KEY[k], ok = m.items[k];
        return '<div class="inv"><span class="ii">' + def.icon + '</span><div class="it"><b>' + esc(def.name) + ' ×' + p.items[k] + '</b><small>' + esc(def.desc) + '</small>' +
          (ok && !ok.ok ? '<small class="why">' + esc(ok.reason) + '</small>' : '') + '</div>' +
          '<button type="button" class="btn small" data-act="useItem" data-k="' + k + '"' + (ok && ok.ok ? '' : ' disabled') + '>Usar</button></div>';
      }).join('') : '<p class="note">No llevas objetos. Visita la tienda.</p>';
      h += '<h3>Cartas <small>(' + p.cards.length + '/' + v.cfg.maxHandCards + ')</small></h3>';
      h += p.cards.length ? p.cards.map((k, i) => {
        const def = D.SHOP_BY_KEY[k];
        return '<div class="inv ' + def.type + '"><span class="ii">' + def.icon + '</span><div class="it"><b>' + esc(def.name) + '</b><small>' + esc(def.desc) + '</small>' +
          (!m.card.ok ? '<small class="why">' + esc(m.card.reason) + '</small>' : '') + '</div>' +
          '<button type="button" class="btn small" data-act="card" data-i="' + i + '"' + (m.card.ok ? '' : ' disabled') + '>' + (def.type === 'attack' ? 'Atacar' : 'Activar') + '</button></div>';
      }).join('') : '<p class="note">No tienes cartas.</p>';
      if (pickCard != null && p.cards[pickCard] && D.SHOP_BY_KEY[p.cards[pickCard]].type === 'attack') {
        h += '<div class="picker"><b>¿A quién atacas con ' + esc(D.SHOP_BY_KEY[p.cards[pickCard]].name) + '?</b>' + m.targets.map(t => {
          const o = U.playerById(v, t.id);
          return '<button type="button" class="btn" data-act="target" data-id="' + t.id + '"' + (t.ok ? '' : ' disabled') + ' style="--pc:' + o.color + '">' + o.avatar + ' ' + esc(o.name) + (t.ok ? '' : ' <small>(' + esc(t.reason) + ')</small>') + '</button>';
        }).join('') + '<button type="button" class="btn ghost" data-act="targetCancel">Cancelar</button></div>';
      }
      h += '</div>';
      return h;
    }

    function screenShop(v) {
      const m = v.me, p = me();
      const st = m.shop;
      return '<div class="ph-card"><h3>Tienda <span class="wallet">' + p.coins + ' 🪙</span></h3>' +
        (v.chaos.active ? '<p class="note">🌀 ¡Rebajas del Caos!</p>' : '') +
        (!st.ok ? '<p class="note warn">' + esc(st.reason) + '</p>' : '') +
        v.catalog.map(c => {
          const b = m.buy[c.key];
          return '<div class="inv"><span class="ii">' + c.icon + '</span><div class="it"><b>' + esc(c.name) + '</b><small>' + esc(c.desc) + '</small>' +
            '<small class="stock">' + (c.stock > 0 ? 'Quedan ' + c.stock : 'Agotado') + '</small>' + (!b.ok && st.ok ? '<small class="why">' + esc(b.reason) + '</small>' : '') + '</div>' +
            '<button type="button" class="btn small buy" data-act="buy" data-k="' + c.key + '"' + (b.ok ? '' : ' disabled') + '>' + c.price + ' 🪙' + (c.price < c.basePrice ? ' <s>' + c.basePrice + '</s>' : '') + '</button></div>';
        }).join('') + '</div>';
    }

    /* ------------------------------ render ------------------------------ */
    function needsAction(v) {
      const m = v.me; if (!m) return false;
      return !!(m.roll || m.answer || m.spin || m.shield || m.drawing || m.guess || m.memoryInput || m.collective || m.shopDone);
    }
    function render() {
      const v = transport.getView(pid); view = v;
      if (!v.me) { root.querySelector('.ph-main').innerHTML = '<div class="ph-card center"><h2>Jugador no encontrado</h2></div>'; return; }
      const p = me(), m = v.me, pd = v.pending;

      // cabecera
      const hs = JSON.stringify([p.name, p.coins, p.dist, p.avatar, v.turn && v.turn.playerId === pid && v.phase === 'playing', v.cfg.goalDistance]);
      if (hs !== sigs.head) {
        sigs.head = hs;
        const my = v.turn && v.turn.playerId === pid && v.phase === 'playing';
        $('.ph-head').style.setProperty('--pc', p.color);
        $('.ph-head').className = 'ph-head' + (my ? ' mine' : '');
        $('.ph-head').innerHTML = '<span class="av">' + p.avatar + '</span><span class="nm"><b>' + esc(p.name) + '</b><small>' + (v.phase === 'playing' ? 'Casilla ' + p.dist + '/' + v.cfg.goalDistance : 'Esperando') + '</small></span><span class="co">' + p.coins + ' 🪙</span>';
      }
      const fs = JSON.stringify(p.effects.map(e => e.type + e.turnsLeft));
      if (fs !== sigs.fx) {
        sigs.fx = fs;
        $('.ph-fx').innerHTML = p.effects.map(e => { const d = D.EFFECTS[e.type]; return '<span class="fxchip" title="' + esc(d.text) + '">' + d.icon + ' ' + esc(d.name) + '</span>'; }).join('');
      }

      // pestaña automática cuando hay algo que hacer
      const act = needsAction(v) && !(m.roll && !pd);
      const key = pd ? (pd.type + (pd.q ? pd.q.id : '') + pd.startedAt + pd.status + pd.phase) : (m.roll ? 'roll' + v.turn.number : '');
      if (needsAction(v) && key !== autoTab) { autoTab = key; if (tab !== 'play') setTab('play'); }
      if (!needsAction(v)) autoTab = '';
      root.querySelector('[data-tab="play"] .dot').style.display = needsAction(v) && tab !== 'play' ? 'inline-block' : 'none';

      // avisos
      if (v.announce && v.announce.seq !== lastAnn) {
        lastAnn = v.announce.seq;
        if (!first && U.now() < v.announce.until) {
          const a = v.announce, tg = a.targets || [];
          if (a.kind !== 'curse' || tg.includes(pid)) flash(a.icon + ' ' + a.title + ' — ' + a.text, a.kind === 'curse' || a.kind === 'chaos' ? 'bad' : '');
        }
      }
      if (v.result && v.result.seq !== lastRes) {
        lastRes = v.result.seq;
        if (!first && U.now() < v.result.until && (v.result.playerId === pid || !v.result.playerId)) flash(v.result.title + ' — ' + v.result.text, v.result.ok ? 'ok' : 'bad');
      }

      // cuerpo: solo se reconstruye cuando cambia lo que se ve (así no se pierde lo escrito)
      let sig;
      if (tab === 'play') {
        sig = JSON.stringify(['play', v.phase, v.turn && v.turn.number, v.turn && v.turn.step, v.turn && v.turn.playerId,
          pd && [pd.type, pd.kind, pd.status, pd.phase, pd.q && pd.q.id, pd.startedAt, pd.hidden, pd.hintText, pd.excluded, pd.eliminated, pd.answered && pd.answered[pid], pd.playerId, pd.curseId, pd.myWord, pd.guesses && pd.guesses[pid], pd.mods],
          m.roll, m.answer, m.pass, m.spin, m.shield, m.drawing, m.guess, m.memoryInput, m.collective, m.shopDone, m.items.hint && m.items.hint.ok, p.items.hint, p.items.shield, p.name, p.avatar, v.jackpot, memSeq.length,
          v.ranking && v.ranking[0].id]);
      } else if (tab === 'bag') {
        sig = JSON.stringify(['bag', p.items, p.cards, m.card, m.items, m.targets, pickCard, v.phase]);
      } else {
        sig = JSON.stringify(['shop', p.coins, p.items, p.cards.length, m.shop, m.buy, v.catalog.map(c => c.stock + ':' + c.price)]);
      }
      if (sig !== sigs.main) {
        sigs.main = sig;
        const saved = main.querySelector('input.txt'), val = saved ? saved.value : '', foc = saved && document.activeElement === saved;
        main.innerHTML = tab === 'play' ? screenPlay(v) : tab === 'bag' ? screenBag(v) : screenShop(v);
        if (tab === 'play') {
          const ni = main.querySelector('input.txt');
          if (ni && val) { ni.value = val; if (foc) ni.focus(); }
          afterPlay(v, pd);
        }
      } else if (tab === 'play' && pd && pd.type === 'challenge' && pd.kind === 'draw') { /* el lienzo no se reconstruye */ }
      first = false;
    }

    function afterPlay(v, pd) {
      if (pd && pd.type === 'challenge' && pd.kind === 'memory' && pd.phase === 'input' && pd.playerId === pid) {
        if (memSeqKey !== pd.startedAt) { memSeqKey = pd.startedAt; memSeq = []; }
        paintMem(pd);
      }
      if (pd && pd.type === 'challenge' && pd.kind === 'draw' && pd.playerId === pid && pd.phase === 'draw') {
        if (dr.key !== pd.startedAt) { dr.key = pd.startedAt; dr.strokes = []; dr.cur = null; dr.eraser = false; }
        dr.canvas = main.querySelector('#ph-canvas');
        U.drawStrokes(dr.canvas, dr.strokes);
        bindCanvas(dr.canvas);
      }
    }
    let memSeqKey = null;
    function paintMem(pd) {
      const box = main.querySelector('#mem-seq'); if (!box) return;
      const n = pd.q.length;
      let s = '';
      for (let i = 0; i < n; i++) s += '<i>' + (memSeq[i] || '') + '</i>';
      box.innerHTML = s;
      const b = main.querySelector('#mem-send'); if (b) b.disabled = memSeq.length !== n;
    }

    /* ------------------------------ dibujo ------------------------------ */
    function pt(ev, c) {
      const r = c.getBoundingClientRect();
      return [Math.max(0, Math.min(1000, Math.round((ev.clientX - r.left) / r.width * 1000))), Math.max(0, Math.min(1000, Math.round((ev.clientY - r.top) / r.height * 1000)))];
    }
    function bindCanvas(c) {
      if (!c) return;
      c.style.touchAction = 'none';
      c.addEventListener('pointerdown', ev => {
        ev.preventDefault(); c.setPointerCapture(ev.pointerId);
        dr.cur = { c: dr.color, w: dr.width, e: dr.eraser, p: [pt(ev, c)] };
        dr.strokes.push(dr.cur); U.drawStrokes(c, dr.strokes);
      });
      c.addEventListener('pointermove', ev => {
        if (!dr.cur) return;
        dr.cur.p.push(pt(ev, c)); U.drawStrokes(c, dr.strokes);
        const t = Date.now(); if (t - dr.lastSend > 350) { dr.lastSend = t; syncDraw(); }
      });
      const end = () => { if (!dr.cur) return; dr.cur = null; syncDraw(); };
      c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
    }
    function syncDraw() { transport.dispatch(pid, { type: 'drawUpdate', strokes: dr.strokes }); }

    /* ------------------------------ eventos ------------------------------ */
    function setTab(t) {
      tab = t; sigs.main = '';
      root.querySelectorAll('.ph-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
      if (view) render();
    }
    root.querySelector('.ph-tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) setTab(b.dataset.tab); });
    root.addEventListener('click', ev => {
      const b = ev.target.closest('[data-act]'); if (!b || b.disabled || b.tagName === 'INPUT') return;
      const a = b.dataset.act;
      if (a === 'roll') send('roll');
      else if (a === 'answer') send('answer', { value: Number(b.dataset.i) });
      else if (a === 'pass') send('pass');
      else if (a === 'hint') send('useItem', { key: 'hint' });
      else if (a === 'spin') send('spin');
      else if (a === 'useShield') send('useShield');
      else if (a === 'declineShield') send('declineShield');
      else if (a === 'shopDone') send('shopDone');
      else if (a === 'buy') { const r = send('buy', { key: b.dataset.k }); if (r.ok) flash('Compra hecha ✔', 'ok'); }
      else if (a === 'useItem') send('useItem', { key: b.dataset.k });
      else if (a === 'card') {
        const i = Number(b.dataset.i), key = view.players.find(x => x.id === pid).cards[i];
        if (D.SHOP_BY_KEY[key].type === 'defense') send('playCard', { index: i }); else { pickCard = i; sigs.main = ''; render(); }
      }
      else if (a === 'target') { const r = send('playCard', { index: pickCard, targetId: b.dataset.id }); pickCard = null; sigs.main = ''; render(); }
      else if (a === 'targetCancel') { pickCard = null; sigs.main = ''; render(); }
      else if (a === 'mem') { const pd = view.pending; if (pd && memSeq.length < pd.q.length) { memSeq.push(b.dataset.s); paintMem(pd); } }
      else if (a === 'memBack') { memSeq.pop(); paintMem(view.pending); }
      else if (a === 'memSend') { const r = send('submitMemory', { seq: memSeq.slice() }); memSeq = []; }
      else if (a === 'color') { dr.color = b.dataset.c; dr.eraser = false; main.querySelectorAll('.col').forEach(x => x.classList.toggle('sel', x === b)); main.querySelector('[data-act="eraser"]').classList.remove('sel'); }
      else if (a === 'eraser') { dr.eraser = !dr.eraser; b.classList.toggle('sel', dr.eraser); main.querySelectorAll('.col').forEach(x => x.classList.toggle('sel', !dr.eraser && x.dataset.c === dr.color)); }
      else if (a === 'undo') { dr.strokes.pop(); U.drawStrokes(dr.canvas, dr.strokes); syncDraw(); }
      else if (a === 'drawFinish') { send('drawFinish', { strokes: dr.strokes }); }
    });
    root.addEventListener('input', ev => { if (ev.target.dataset && ev.target.dataset.act === 'width') dr.width = Number(ev.target.value); });
    root.addEventListener('submit', ev => {
      ev.preventDefault();
      const f = ev.target, kind = f.dataset.form, inp = f.querySelector('input'), val = inp ? inp.value.trim() : '';
      if (kind === 'answer') { if (val) { const r = send('answer', { value: val }); if (r.ok) inp.value = ''; } }
      else if (kind === 'guess') { if (val) { send('guess', { text: val }); inp.value = ''; inp.focus(); } }
      else if (kind === 'rename') { send('rename', { name: val }); }
    });

    const clock = () => { const d = new Date(); $('.ph-clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
    clock(); const ci = setInterval(() => { if (!root.isConnected) clearInterval(ci); else clock(); }, 20000);
    root.querySelector('[data-tab="play"]').classList.add('on');

    // escala todo el móvil según el tamaño de su ventana (se usa em en el CSS)
    function setScale(w, h) { const u = Math.max(0.62, Math.min(2.4, Math.min(w / 340, h / 640))); root.style.fontSize = (16 * u).toFixed(2) + 'px'; }

    return { render, setScale, pid, flash };
  };
})();

</script>
  <script>
/* ==========================================================================
   world.js — Mundo 2D de islas flotantes (coordenadas propias 4500×3300),
   circuito cerrado de 40 casillas y cámara. La interfaz queda fija fuera.
   ========================================================================== */
(function () {
  'use strict';
  const TE = (window.TE = window.TE || {});
  const W = 7400, H = 5500, N = 40;
  let sd = 7; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const IS = [[880,860,544,376,'faro'],[2420,700,529,368,'bosque'],[3980,880,529,376,'cascada'],[5520,720,529,368,'castillo'],
    [6460,2000,512,384,'volcan'],[6120,3340,544,384,'cristal'],[4780,4020,529,376,'ciudad'],[3060,3980,529,376,'observatorio'],
    [1700,4300,529,368,'hielo'],[800,3100,512,384,'arboles'],[960,1950,512,376,'ruinas']];

      setTimeout(() => {
        const el = tokenEls[pid], p = view && view.players.find(q => q.id === pid);
        if (!el || !p) return;
        const m = /#an-([a-z]+)/.exec(p.avatar || ''); if (!m) return;
        const key = m[1];
        el.className = el.className.replace(/\barr-\w+/g, '').trim();
        void el.offsetWidth;
        el.classList.add('arr-' + key);
        killFx(pid);
        if (FX[key]) {
          const f = document.createElement('div'); f.className = 'tk-fx2 fx-' + key;
          f.style.transform = el.style.transform;
          f.innerHTML = '<svg viewBox="-44 -44 160 160" width="160" height="160">' + FXDEFS + FX[key]() + '</svg>';
          tokensEl.appendChild(f); fxEls[pid] = f;
          fxTimers[pid] = setTimeout(() => killFx(pid), 2300);
        }
        clearTimeout(arrTimers[pid]);
        arrTimers[pid] = setTimeout(() => { el.classList.remove('arr-' + key); }, 1400);
      }, delay || 0);

    function walk(pid, from, to, delayMs) {
      walking[pid] = true;
      let cur = from;
      const stepMs = D.SETTINGS.stepMs;
      shown[pid] = from;
      const stepOnce = () => {
        if (cur >= to) { walking[pid] = false; shown[pid] = view ? view.players.find(p => p.id === pid).dist : to; layoutTokens(); arrive(pid, 150); return; }
        cur++; shown[pid] = cur; TE.Audio.play('step'); layoutTokens();
        setTimeout(stepOnce, stepMs);
      };
      setTimeout(stepOnce, Math.max(0, delayMs));
      layoutTokens();
    }
    function syncTokens(v) {
      v.players.forEach(p => {
        ensureToken(p);
        if (shown[p.id] == null) shown[p.id] = p.dist;
      });
      const mv = v.move;
      if (mv && mv.seq !== last.move) {
        last.move = mv.seq;
        if (mv.kind === 'walk' && !first && mv.to > mv.from) {
          const wait = v.dice ? Math.max(0, v.dice.revealAt - v.serverNow) : 0;
          walk(mv.playerId, mv.from, mv.to, wait);
        } else if (mv.kind !== 'walk' && !first) {
          v.players.forEach(p => { if (!walking[p.id]) shown[p.id] = p.dist; });
          const el = tokenEls[mv.playerId]; if (el) { el.classList.add('hop'); setTimeout(() => el.classList.remove('hop'), 900); } arrive(mv.playerId, 450);
        }
      }
      v.players.forEach(p => { if (!walking[p.id] && shown[p.id] !== p.dist) shown[p.id] = p.dist; });
      layoutTokens();
    }

        const am = (a0 + a1) / 2, tx = cx + R * 0.74 * Math.cos(am), ty = cy + R * 0.74 * Math.sin(am);
        const rot = (am * 180 / Math.PI) + 90;
        s += '<path d="M' + cx + ',' + cy + ' L' + x0.toFixed(1) + ',' + y0.toFixed(1) + ' A' + R + ',' + R + ' 0 0 1 ' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' Z" fill="' + pr.color + '" stroke="#1b1208" stroke-width="3" opacity="' + (i % 2 ? '0.88' : '1') + '"/>';
        s += '<g transform="translate(' + tx.toFixed(1) + ',' + ty.toFixed(1) + ') rotate(' + rot.toFixed(1) + ')"><text y="-4" text-anchor="middle" font-size="26">' + pr.icon + '</text><text y="22" text-anchor="middle" font-size="17" font-weight="800" fill="#1b1208">' + esc(pr.label) + '</text></g>';
      });
      s += '</g><circle cx="250" cy="250" r="34" fill="#1b1208" stroke="#e0b04a" stroke-width="6"/><text x="250" y="259" text-anchor="middle" font-size="26">✦</text></svg><div class="wheel-pointer"></div>';
      return s;
    }
    function centerRoulette(v, pd) {
      const who = U.playerById(v, pd.playerId);
      return '<div class="c-roulette"><h2>🎡 ' + esc(who.name) + (pd.status === 'ready' ? ' va a girar la ruleta' : ' gira la ruleta…') + '</h2>' +
        '<div class="wheel-wrap">' + wheelSVG() + '</div>' +
        '<div class="wheel-jackpot">Bote en juego: <b>' + v.jackpot + ' 🪙</b></div>' +
        (pd.status === 'ready' ? U.timerHTML(pd) + '<p class="hint-line">' + esc(who.name) + ', pulsa «Girar» en tu móvil</p>' : '') + '</div>';
    }

    function centerShield(v, pd) {
      const who = U.playerById(v, pd.playerId), c = D.CURSE_BY_ID[pd.curseId];
      return '<div class="c-shield"><div class="big-ico">' + c.icon + '</div><h2>' + esc(c.name) + '</h2><p>' + esc(c.text) + '</p>' +
        '<p class="shield-q">🛡️ ' + esc(who.name) + ' puede gastar un escudo para bloquearla</p>' + U.timerHTML(pd) + '</div>';
    }
    function centerChaosIntro(v, pd) {
      const who = U.playerById(v, pd.playerId);
      return '<div class="c-chaos"><div class="swirl" aria-hidden="true"></div><div class="big-ico">🧙</div><h2>Reglas del Caos</h2><ul>' +
        '<li>⚔️ Los retos son más difíciles y más breves</li><li>💰 Los premios de los retos valen ×1,5</li><li>🪙 Los tesoros dan el doble y el camino da +1</li><li>🛒 La tienda tiene −25%</li>' +
        '<li>🏁 Dura hasta que <b>' + esc(who.name) + '</b> complete una vuelta (' + D.SETTINGS.chaos.lapDistance + ' casillas)</li></ul></div>';
    }
    function centerResult(v, r) {
      const who = r.playerId ? U.playerById(v, r.playerId) : null;
      return '<div class="c-result ' + (r.ok ? 'ok' : 'ko') + '"><div class="r-ico">' + (who ? who.avatar : '👥') + '</div><h2>' + esc(r.title) + '</h2><p>' + esc(r.text) + '</p>' +
        (r.answer ? '<div class="r-answer">Respuesta: <b>' + esc(r.answer) + '</b></div>' : '') + '</div>';
    }
    function centerIdle(v) {
      const cur = U.playerById(v, v.turn.playerId);
      const d = v.dice;
      const moving = v.turn.step === 'moving';
      const val = d ? d.value : 1;
      return '<div class="c-idle"><div class="idle-avatar" style="--pc:' + cur.color + '">' + cur.avatar + '</div>' +
        '<h2>' + (moving ? esc(cur.name) + ' tira el dado' : 'Turno de ' + esc(cur.name)) + '</h2>' +
        '<div class="dice-stage" id="dice-stage">' + U.dieHTML(val, d && moving ? 'rolling' : '') + '</div>' +
        '<p class="dice-note" id="dice-note">' + (moving && d ? '' : (cur.name + ', tira el dado desde tu móvil')) + '</p>' +
        (d && d.mods && d.mods.length && moving ? '<div class="mods">' + d.mods.map(m => '<span class="mod">' + esc(m) + '</span>').join('') + '</div>' : '') + '</div>';
    }

    function renderCenter(v) {
      const pd = v.pending, t = U.now();
      let html = '', kind = 'idle', sig;
      const res = v.result && t < v.result.until ? v.result : null;
      if (v.phase === 'lobby') { kind = 'lobby'; sig = 'lobby|' + v.players.map(p => p.id + p.name).join(','); html = centerLobby(v); }
      else if (v.phase === 'ended') { kind = 'end'; sig = 'end'; html = centerEnded(v); }
      else if (pd) {
        const pass = [pd.type, pd.kind, pd.status, pd.phase, pd.q && pd.q.id, pd.startedAt, (pd.hidden || []).join(), pd.hintText, (pd.excluded || []).join(), (pd.eliminated || []).join(), JSON.stringify(pd.answered || {}), pd.playerId, pd.curseId, pd.spinSeq].join('|');
        sig = 'pd|' + pass; kind = pd.type;
        if (pd.type === 'challenge') html = centerChallenge(v, pd);
        else if (pd.type === 'collective') html = centerCollective(v, pd);
        else if (pd.type === 'shop') { sig += '|' + JSON.stringify(v.catalog.map(c => c.stock + ':' + c.price)); html = centerShop(v, pd); }
        else if (pd.type === 'roulette') html = centerRoulette(v, pd);
        else if (pd.type === 'shield') html = centerShield(v, pd);
        else if (pd.type === 'chaosIntro') html = centerChaosIntro(v, pd);
      } else if (res) { sig = 'res|' + res.seq; kind = 'result'; html = centerResult(v, res); }
      else { sig = 'idle|' + v.turn.playerId + '|' + v.turn.step + '|' + (v.dice ? v.dice.seq : 0) + '|' + v.turn.number; html = centerIdle(v); }

      const chaosBar = (v.chaos.active && v.phase === 'playing') ? chaosBanner(v) : '';
      sig += '|' + (chaosBar ? 'c' : '');
      if (sig !== centerSig) {
        const oldInp = centerEl.querySelector('#addform input');
        const keepTxt = oldInp ? oldInp.value : '', keepFocus = oldInp && document.activeElement === oldInp;
        centerSig = sig;
        centerEl.className = 'tvc k-' + kind + (v.chaos.active ? ' chaos' : '');
        centerEl.innerHTML = '<div class="tvc-inner">' + html + '</div><div id="chaos-bar">' + chaosBar + '</div>';
        const newInp = centerEl.querySelector('#addform input');
        if (newInp && keepTxt) newInp.value = keepTxt;
        if (newInp && keepFocus) newInp.focus();
        afterCenter(v, pd, kind);
      } else {
        const cb = centerEl.querySelector('#chaos-bar'); if (cb && chaosBar) cb.innerHTML = chaosBar;
        if (pd && pd.type === 'challenge' && pd.kind === 'draw') U.drawStrokes(centerEl.querySelector('#tv-canvas'), pd.strokes);
      }
      if (res && !pd && kind === 'result') {
        setTimeout(() => { if (view && view.result && view.result.seq === res.seq) render(); }, Math.max(50, res.until - t + 30));
      }
    }
    function chaosBanner(v) {
      const a = U.playerById(v, v.chaos.activatorId);
      const left = Math.max(0, v.chaos.endDist - (a ? a.dist : 0));
      return '<div class="chaos-banner">🌀 MODO CAOS · ' + esc(a ? a.name : '') + ' debe avanzar ' + left + ' casillas más para acabarlo</div>';
    }

    function afterCenter(v, pd, kind) {
      clearInterval(diceTimer); clearInterval(memTimer);
      if (kind === 'idle') {
        const d = v.dice, die = centerEl.querySelector('.die'), note = centerEl.querySelector('#dice-note');
        if (d && v.turn.step === 'moving' && die) {
          const left = d.revealAt - U.now();
          if (left > 0) {
            diceTimer = setInterval(() => {
              if (U.now() >= d.revealAt) {
                clearInterval(diceTimer); die.classList.remove('rolling'); U.setDieValue(die, d.value);
                if (note) note.innerHTML = '<b>' + d.value + '</b>' + (d.applied !== d.value ? ' → avanza ' + d.applied : '');
              } else U.setDieValue(die, 1 + Math.floor(Math.random() * 6));
            }, 90);
          } else { die.classList.remove('rolling'); U.setDieValue(die, d.value); if (note) note.innerHTML = '<b>' + d.value + '</b>' + (d.applied !== d.value ? ' → avanza ' + d.applied : ''); }
        }
      }
      if (kind === 'challenge' && pd.kind === 'draw') U.drawStrokes(centerEl.querySelector('#tv-canvas'), pd.strokes);
      if (kind === 'challenge' && pd.kind === 'memory' && pd.phase === 'show') {
        const sym = centerEl.querySelector('#mem-sym'), dots = centerEl.querySelectorAll('.mem-dots i'), ms = D.SETTINGS.memoryShowMsPerSymbol;
        const upd = () => {
          const k = Math.floor((U.now() - pd.startedAt) / ms);
          if (k >= pd.q.seq.length || k < 0) { sym.textContent = '…'; return; }
          sym.textContent = pd.q.seq[k]; sym.style.animation = 'none'; void sym.offsetWidth; sym.style.animation = '';
          dots.forEach((d, i) => d.classList.toggle('on', i <= k));
        };
        upd(); let lk = -1;
        memTimer = setInterval(() => { const k = Math.floor((U.now() - pd.startedAt) / ms); if (k !== lk) { lk = k; upd(); } }, 80);
      }
      if (kind === 'roulette') setupWheel(v, pd);
    }
    function setupWheel(v, pd) {
      const g = centerEl.querySelector('#wheel-rot'); if (!g) return;
      const wrap = centerEl.querySelector('.wheel-wrap');
      const n = D.ROULETTE_WHEEL.length;
      g.style.transformOrigin = '250px 250px';
      g.style.transform = 'rotate(0deg)';
      if (pd.status === 'spinning' && pd.resultIndex != null) {
        const final = 360 * 5 - (pd.resultIndex + 0.5) * (360 / n);
        const left = Math.max(300, pd.deadline - U.now());
        g.style.transition = 'none';
        // si ya pasó parte del giro (re-render), se acorta la animación
        requestAnimationFrame(() => requestAnimationFrame(() => {
          g.style.transition = 'transform ' + left + 'ms cubic-bezier(.12,.62,.08,1)';
          g.style.transform = 'rotate(' + final + 'deg)';
        }));
        wrap.classList.add('spinning');
        if (pd.spinSeq !== last.spin) { last.spin = pd.spinSeq; TE.Audio.play('spin'); }
      }
    }

    /* ------------------------------ anuncios ------------------------------ */
    function renderAnnounce(v) {
      const a = v.announce;
      if (!a || a.seq === last.ann) return;
      last.ann = a.seq;
      const t = U.now();
      if (first || t >= a.until) return;
      const el = $('#announce');
      let extra = '';
      if (a.kind === 'curse') {
        const tg = (a.targets || []).map(id => U.playerById(v, id)).filter(Boolean);
        extra = '<div class="ann-scope">' + (a.scope === 'all' ? 'MALDICIÓN COLECTIVA' : a.scope === 'multi' ? 'MALDICIÓN DOBLE' : 'MALDICIÓN') + '</div><div class="ann-targets">' + tg.map(p => chip(p, 'live', '')).join('') + '</div>';
      }
      el.className = 'announce show k-' + a.kind + (a.scope ? ' s-' + a.scope : '');
      el.innerHTML = '<div class="ann-card"><div class="ann-icon">' + esc(a.icon || '✨') + '</div>' + extra + '<h2>' + esc(a.title) + '</h2><p>' + esc(a.text) + '</p></div>';
      const snd = { curse: 'curse', chaos: 'chaos', avalanche: 'avalanche', win: 'win', collective: 'good', event: 'good', chaosEnd: 'good' }[a.kind];
      if (snd) TE.Audio.play(snd);
      clearTimeout(annTimer);
      annTimer = setTimeout(() => { el.className = 'announce'; }, Math.max(300, a.until - t));
    }

    /* ------------------------------ efectos sobre las casillas ------------------------------ */
    function renderTileFx(v) {
      tilesEl.classList.toggle('chaosfx', !!v.chaos.active);
      const curP = v.turn && v.phase === 'playing' ? U.playerById(v, v.turn.playerId) : null;
      tilesEl.querySelectorAll('.tile.here').forEach(el => el.classList.remove('here'));
      if (curP) { const el = tilesEl.children[(shown[curP.id] || 0) % v.cfg.boardSize]; if (el) el.classList.add('here'); }
      const l = v.landed;
      if (l && l.seq !== last.land) {
        last.land = l.seq;
        if (!first) {
          const el = tilesEl.children[l.index];
          if (el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); setTimeout(() => el.classList.remove('pop'), 1600); }
          const snd = { coins: 'coin', curse: 'curse', roulette: 'coin', shop: 'click', event: 'good', chaos: 'chaos', challenge: 'click' }[l.type];
          if (snd && l.type !== 'curse' && l.type !== 'chaos') TE.Audio.play(snd);
        }
      }
    }

    /* ------------------------------ render principal ------------------------------ */
    function render() {
      const v = transport.getView('tv');
      U.setClockFrom(v);
      view = v;
      document.body.classList.toggle('chaos-mode', !!v.chaos.active && v.phase === 'playing');
      document.body.classList.toggle('phase-lobby', v.phase === 'lobby');
      document.body.classList.toggle('phase-ended', v.phase === 'ended');
      syncTokens(v);
      renderSide(v);
      renderCenter(v);
      renderTileFx(v);
      renderAnnounce(v);
      if (v.dice && v.dice.seq !== last.dice) { last.dice = v.dice.seq; if (!first && v.dice.revealAt > U.now()) TE.Audio.play('dice'); }
      if (v.result && v.result.seq !== last.res) {
        last.res = v.result.seq;
        if (!first && U.now() < v.result.until) TE.Audio.play(v.result.kind === 'roulette' || v.result.kind === 'gift' ? 'coin' : v.result.kind === 'shield' ? 'shield' : v.result.ok ? 'good' : 'bad');
      }
      if (last.phase !== v.phase && v.phase === 'ended') TE.Audio.play('win');
      last.phase = v.phase;
      first = false;
    }

    // Escalado del escenario 1920×1080 al tamaño real de la ventana
    function fit() {
      const vp = document.getElementById('tv-viewport');
      const portrait = window.innerHeight > window.innerWidth * 1.05, SW = portrait ? 1080 : 1920, SH = portrait ? 1920 : 1080;
      document.body.classList.toggle('portrait', portrait);
      root.style.width = SW + 'px'; root.style.height = SH + 'px';
      const k = Math.min(window.innerWidth / SW, window.innerHeight / SH);
      root.style.transform = 'scale(' + k + ')';
      root.style.left = Math.round((window.innerWidth - SW * k) / 2) + 'px';
      root.style.top = Math.round((window.innerHeight - SH * k) / 2) + 'px';
      vp.style.setProperty('--k', k);
    }
    window.addEventListener('resize', fit); fit();

    return { render, getView: () => view, destroy() { clearInterval(diceTimer); clearInterval(memTimer); } };
  };
})();

  <script>
/* ==========================================================================
   dev.js — Modo desarrollador: panel de pruebas + móviles flotantes
   Es una capa opcional sobre el mismo juego: no duplica reglas, solo envía
   acciones 'dev*' que el motor valida (y rechaza si allowDev es false).
   ========================================================================== */
(function () {
  'use strict';
  const TE = (window.TE = window.TE || {});
  const D = TE.Data, U = TE.UI, esc = U.esc;

  TE.createDev = function (transport) {
    const phones = {};          // pid -> { win, phone }
    let panel = null, panelSig = '', msgTimer = null, enabled = true;

    const dev = (type, extra) => {
      const r = transport.dispatch('dev', Object.assign({ type }, extra || {}));
      say(r.ok ? '✔ ' + type : '✘ ' + r.error, r.ok);
      return r;
    };
    function say(t, ok) {
      if (!panel) return;
      const m = panel.body.querySelector('.dv-msg'); if (!m) return;
      m.textContent = t; m.className = 'dv-msg ' + (ok ? 'ok' : 'err');
      clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.textContent = ''; }, 4000);
    }

    /* ------------------------------ móviles flotantes ------------------------------ */
    function openPhone(pid) {
      const v = transport.getView('dev');
      const p = U.playerById(v, pid); if (!p) { say('Ese jugador no existe todavía.', false); return; }
      let rec = phones[pid];
      if (!rec) {
        const idx = v.players.findIndex(x => x.id === pid);
        const w = 300, h = Math.min(620, window.innerHeight - 40);
        const win = TE.FloatingWindow({
          title: '<span style="color:' + p.color + '">●</span> ' + esc(p.name), className: 'fw-phone',
          x: Math.max(8, window.innerWidth - (idx + 1) * (w + 14)), y: 20, w, h, minW: 200, minH: 300,
          onResize: (bw, bh) => { if (rec) rec.phone.setScale(bw, bh); }
        });
        const phone = TE.createPhone(win.body, pid, transport);
        rec = phones[pid] = { win, phone };
        win.show(); phone.render(); phone.setScale(win.body.clientWidth, win.body.clientHeight);
      } else { rec.win.show(); rec.phone.render(); }

    function openMany(n) {
      const v = transport.getView('dev');
      v.players.slice(0, n).forEach(p => openPhone(p.id));
    }
    function arrange() {
      const open = Object.keys(phones).filter(k => phones[k].win.isOpen());
      const w = 300, h = Math.min(620, window.innerHeight - 40);
      open.forEach((k, i) => { phones[k].win.state.max = false; phones[k].win.state.min = false; phones[k].win.resizeTo(w, h); phones[k].win.moveTo(Math.max(8, window.innerWidth - (i + 1) * (w + 14)), 20); });
    }
    function closeAll() { Object.values(phones).forEach(r => r.win.hide()); updatePanel(true); }

    function refreshPhones() {
      Object.keys(phones).forEach(pid => {
        const r = phones[pid];
        const v = transport.getView('dev');
        const p = U.playerById(v, pid);
        if (!p) { r.win.destroy(); delete phones[pid]; return; }   // jugador eliminado (nueva partida con menos jugadores)
        if (r.win.isOpen() || true) { r.phone.render(); }
        r.win.setTitle('<span style="color:' + p.color + '">●</span> ' + esc(p.name));
      });
    }

    /* ------------------------------ panel ------------------------------ */
    function buildPanel() {
      panel = TE.FloatingWindow({ title: '🛠 Panel de administrador', className: 'fw-dev', x: 12, y: 12, w: 340, h: Math.min(720, window.innerHeight - 24), minW: 280, minH: 200 });
      panel.body.classList.add('dv');
      panel.body.addEventListener('click', onClick);
      panel.body.addEventListener('change', ev => { if (ev.target.dataset.keep) keep[ev.target.dataset.keep] = ev.target.value; });
      panel.show();
    }
    const keep = { count: '3', player: 'p1', item: 'shield', curse: 'pockets', target: 'cur', dice: '3', coins: '20', dist: '10', kind: 'choice', goal: String(D.SETTINGS.goalDistance) };
    function sel(id, options, cur) { return '<select data-keep="' + id + '" id="dv-' + id + '">' + options.map(o => '<option value="' + o[0] + '"' + (String(o[0]) === String(cur) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>'; }
    const val = id => { const e = panel.body.querySelector('#dv-' + id); return e ? e.value : keep[id]; };

    function updatePanel(force) {
      if (!panel) return;
      const v = transport.getView('dev');
      const sig = JSON.stringify([v.players.map(p => p.id + p.name), v.phase, Object.keys(phones).map(k => phones[k].win.isOpen()), v.chaos.used, v.chaos.active, !!(TE.cam && TE.cam.isFree())]);
      if (sig === panelSig && !force) { statusLine(v); return; }
      panelSig = sig;
      const players = v.players.map(p => [p.id, p.name]);
      const pOpts = players.length ? players : [['', '(sin jugadores)']];
      if (!players.some(p => p[0] === keep.player)) keep.player = players.length ? players[0][0] : '';
      const keepMsg = (panel.body.querySelector('.dv-msg') || {}).textContent || '';
      panel.body.innerHTML =
        '<div class="dv-msg"></div><div class="dv-status" id="dv-status"></div>' +
        '<div class="dv-row"><button data-d="clean" class="hl">Cerrar modo administrador</button></div>' +
        '<div class="dv-row"><button data-d="freecam" class="' + ((TE.cam && TE.cam.isFree()) ? 'hl' : '') + '">🎥 Cámara panorámica: ' + ((TE.cam && TE.cam.isFree()) ? 'DESACTIVAR' : 'ACTIVAR') + '</button></div>' +
        '<p class="muted">Cámara libre para revisar el mapa: WASD o flechas para moverte, ratón (arrastrar) y rueda para zoom. Esc para salir.</p>' +
        '<details open><summary>Partida</summary>' +
          '<div class="dv-row">' + sel('count', [2, 3, 4, 5, 6].map(n => [n, n + ' jugadores']), keep.count) + '<button data-d="setup">Crear partida de prueba</button></div>' +
          '<div class="dv-row"><button data-d="quick" class="hl">⚡ Inicio rápido: 3 jugadores + 3 móviles</button></div>' +
          '<div class="dv-row"><button data-d="reset">Reiniciar partida</button><button data-d="lobby">Volver al lobby</button></div>' +
        '</details>' +
        '<details open><summary>Móviles simulados</summary><div class="dv-row wrap">' +
          v.players.map(p => '<button data-d="phone" data-id="' + p.id + '" style="--pc:' + p.color + '" class="' + (phones[p.id] && phones[p.id].win.isOpen() ? 'on' : '') + '">' + p.avatar + ' ' + esc(p.name) + '</button>').join('') + (v.players.length ? '' : '<span class="muted">Crea jugadores primero</span>') + '</div>' +
          '<div class="dv-row"><button data-d="open3">Abrir 3 móviles</button><button data-d="arrange">Ordenar</button><button data-d="closeall">Cerrar todos</button></div>' +
        '</details>' +
        '<details open><summary>Jugador de prueba</summary>' +
          '<div class="dv-row">' + sel('player', pOpts, keep.player) + '</div>' +
          '<div class="dv-row"><button data-d="coins" data-n="-5">−5</button><button data-d="coins" data-n="5">+5</button><button data-d="coins" data-n="20">+20</button><button data-d="coins" data-n="set0">0 🪙</button></div>' +
          '<div class="dv-row"><input id="dv-coins" data-keep="coins" type="number" min="0" value="' + keep.coins + '"><button data-d="setcoins">Fijar monedas</button></div>' +
          '<div class="dv-row">' + sel('item', D.SHOP.map(s => [s.key, s.icon + ' ' + s.name]), keep.item) + '<button data-d="give">Dar</button></div>' +
          '<div class="dv-row"><input id="dv-dist" data-keep="dist" type="number" min="0" value="' + keep.dist + '"><button data-d="tp">Mover a casilla</button></div>' +
          '<div class="dv-row">' + sel('dice', [1, 2, 3, 4, 5, 6].map(n => [n, 'Dado: ' + n]), keep.dice) + '<button data-d="dice">Fijar próxima tirada</button></div>' +
        '</details>' +
        '<details open><summary>Mecánicas</summary>' +

      else if (a === 'tp') dev('devTeleport', { playerId: pid, dist: Number(val('dist')) });

    function setEnabled(on) {

  };

  <script id="net-js">
/* ==========================================================================
   net.js — Conexión en línea de "Tablero Encantado" (salas con código)
   --------------------------------------------------------------------------
   Modelo: la PANTALLA PRINCIPAL (TV) sigue ejecutando el motor, como siempre.
   Los móviles reales solo envían acciones y pintan su vista (getView(pid)),
   igual que los móviles simulados. Aquí hay tres piezas:
     1. createHostBridge  — en la TV: recibe acciones de los móviles, las pasa
        al motor (que valida turno y permisos) y publica la vista de cada uno.
     2. Panel de sala     — en la TV: crear sala, código, lista de móviles.
     3. Cliente móvil     — en el móvil: unirse con código y jugar.
   Si la página se abre sin servidor (archivo local) NADA de esto se activa.
   ========================================================================== */
(function (root) {
  'use strict';
  const TE = (root.TE = root.TE || {});
  const PHONE_ACTIONS = ['roll', 'answer', 'pass', 'useItem', 'spin', 'useShield', 'declineShield', 'shopDone',
    'buy', 'playCard', 'submitMemory', 'guess', 'drawUpdate', 'drawFinish', 'rename'];
  const SKIP_AFTER_MS = 25000;       // turno de un jugador desconectado: se salta pasado este tiempo
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ------------------------------ red ------------------------------ */
  async function api(base, path, body, method) {
    const r = await fetch(base + path, { method: method || (body === undefined ? 'GET' : 'POST'), cache: 'no-store',
      headers: body === undefined ? undefined : { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
    let j = null; try { j = await r.json(); } catch (e) { /* sin cuerpo */ }

  }

  /* Lector de Server-Sent Events con fetch (sin EventSource): reconecta solo. */
  function openStream(urlFn, on) {
    let stop = false, ctrl = null, delay = 700;

          if (!r.ok) throw new Error('http ' + r.status);

            const x = await rd.read(); if (x.done) break;
            buf += dec.decode(x.value, { stream: true });
            let i;
            while ((i = buf.indexOf('\n\n')) >= 0) {
              const blk = buf.slice(0, i); buf = buf.slice(i + 2);
              let ev = 'message', data = '';
              blk.split('\n').forEach(l => { if (l.startsWith('event: ')) ev = l.slice(7); else if (l.startsWith('data: ')) data += l.slice(6); });
              if (data) { let d; try { d = JSON.parse(data); } catch (e) { continue; } if (on.event) on.event(ev, d); }
            }
          }
        } catch (e) { if (stop) return; }
        if (on.close) on.close();
        if (stop) return;
        await sleep(delay); delay = Math.min(delay * 1.6, 5000);

    })();
    return { stop() { stop = true; if (ctrl) ctrl.abort(); }, kick() { if (ctrl) ctrl.abort(); } };
  }

  /* ==========================================================================
     1. Puente de la TV (sin DOM: se puede probar en Node)
     ========================================================================== */
  function createHostBridge(o) {

    const offlineSince = {};              // pid -> ms
    const lastSig = {};

    const pidOnline = pid => { for (const c of clients.values()) if (c.pid === pid) return c.online !== false; return true; };
    const isReal = pid => { for (const c of clients.values()) if (c.pid === pid) return true; return false; };

    /* Vista para un espectador, marcando a los jugadores desconectados (📵). */
    function viewFor(viewer) {
      const v = engine.getView(viewer);
      v.players.forEach(p => { if (p.id !== viewer && isReal(p.id) && !pidOnline(p.id)) { p.offline = true; p.name = p.name + ' 📵'; } });
      return v;
    }

    function reply(reqId, result) {
      if (reqId === '-') return;
      api(base, '/api/host/reply?code=' + room.code + '&token=' + room.token, { reqId, result }).catch(() => {});
    }
    function onRpc(m) {
      if (m.kind === 'join') {
        const r = engine.dispatch('host', { type: 'addPlayer', name: m.name });
        if (r.ok) { clients.set(m.clientId, { pid: r.id, name: m.name, online: true }); onChange(); schedulePush(true); return reply(m.reqId, { ok: true, pid: r.id }); }
        return reply(m.reqId, { ok: false, error: r.error });

        const a = m.action;
        if (!a || PHONE_ACTIONS.indexOf(a.type) < 0) return reply(m.reqId, { ok: false, error: 'Acción no permitida.' });
        if (![...clients.values()].some(c => c.pid === m.pid)) return reply(m.reqId, { ok: false, error: 'Jugador desconocido.' });

          Object.keys(views).forEach(pid => { views[pid].serverNow = engine.getView(pid).serverNow; });

      if (again) { again = false; schedulePush(); }
    }

    /* Desconexiones: si le toca a un jugador sin conexión, se salta su turno. */
    function watchTurns() {
      const st = engine.getState(), now = Date.now();
      if (!st || st.phase !== 'playing' || !st.turn) return;
      const pid = st.turn.playerId;
      if (!isReal(pid) || pidOnline(pid)) return;
      const idle = !st.pending && !st.sched && st.turn.step === 'roll';
      if (idle && offlineSince[pid] && now - offlineSince[pid] > SKIP_AFTER_MS) {
        const name = (st.players.find(p => p.id === pid) || {}).name || 'Jugador';
        engine.dispatch('dev', { type: 'devSkipTurn' });
        offlineSince[pid] = now;               // no encadenar saltos: vuelve a esperar 25 s si sigue desconectado

    async function createRoom() {

        event(ev, d) {

    }

  }

        '<input id="j-name" class="nm" maxlength="14" placeholder="Tu nombre" autocomplete="off" value="' + esc((session && session.name) || '') + '">' +
        '<button id="j-go">Entrar</button><div class="err" id="j-err">' + esc(msg || '') + '</div>';

      kind: 'remote',
      getView: () => lastView,
      subscribe: () => () => {},
      dispatch(pid, action) {
        if (!session) return { ok: false, error: 'Sin sesión.' };

      const fit = () => phone.setScale(innerWidth, innerHeight); fit(); addEventListener('resize', fit);
      setConn('● conectando…', false);

        open() { setBanner(''); setConn('● online', true); },
        close() { setConn('● reconectando…', false); setBanner('Reconectando…'); },
        fatal(code) { store.set('net.session', null); session = null; showJoin(code === 403 || code === 404 ? 'La sala ya no existe o te han sacado de ella.' : 'Error de conexión.'); },

    // ¿hay sesión guardada para esta sala? se reintenta sola (por si se cerró la pestaña)
    (async () => {
      const wanted = (params.get('room') || params.get('sala') || '').toUpperCase();
      if (session && (!wanted || wanted === session.code)) {
        try {
          const r = await api('', '/api/join', { code: session.code, name: session.name, clientId: session.clientId, secret: session.secret });
          if (r.ok && r.reconnect) { start(); return; }
        } catch (e) { /* se muestra el formulario */ }
      }
      showJoin();
    })();

  <script>
/* ==========================================================================
   main.js — Arranque: motor + transporte local + TV + modo desarrollador
   Para el multijugador real solo habría que sustituir createLocalTransport
   por un transporte que hable con el servidor (ver docs/FUTURO.md).
   ========================================================================== */
(function () {
  'use strict';
  const TE = (window.TE = window.TE || {});
  const U = TE.UI;

  /* Transporte local: la interfaz solo conoce estas tres funciones. */
  function createLocalTransport(engine) {
    return {
      kind: 'local',
      dispatch: (actor, action) => engine.dispatch(actor, action),
      getView: viewer => engine.getView(viewer),
      subscribe: fn => engine.subscribe(fn)
    };
  }
  TE.createLocalTransport = createLocalTransport;

  function boot() {
    const params = new URLSearchParams(location.search);
    if (TE.phoneMode && TE.Net) { U.startTimers(); TE.Net.bootPhone(); return; }   // móvil real (/play)
    const engine = TE.Engine.createEngine({ allowDev: true });
    const transport = createLocalTransport(engine);
    TE.Audio.applyMotion();
    U.startTimers();

    const tv = TE.createTV(document.getElementById('stage'), transport);
    const dev = TE.createDev(transport);

    let queued = false;
    function renderAll() {
      queued = false;
      try { tv.render(); } catch (e) { reportError(e); }
      try { dev.update(); } catch (e) { reportError(e); }
    }
    function schedule() {
      if (queued) return; queued = true;
      (document.hidden ? setTimeout : requestAnimationFrame)(renderAll, 0);
    }
    transport.subscribe(schedule);

    // El tiempo avanza aquí: el motor decide qué ocurre al vencer cada temporizador.
    setInterval(() => { try { engine.tick(); } catch (e) { reportError(e); } }, 200);

    function setDevMode(on) {
      U.store.set('dev', !!on);
      dev.setEnabled(!!on);
    }
    let devOn = params.has('dev') ? params.get('dev') !== '0' : U.store.get('dev', true);
    setDevMode(devOn);
    window.addEventListener('keydown', ev => {
      if (ev.altKey && ev.shiftKey && (ev.key === 'D' || ev.key === 'd')) { ev.preventDefault(); setDevMode(!dev.isEnabled()); }
    });

    if (params.get('auto') === '1') { // atajo: ?auto=1 crea una partida de 3 y abre 3 móviles
      transport.dispatch('dev', { type: 'devSetup', count: 3, start: true });
      if (dev.isEnabled()) dev.openMany(3);
    }

    TE.app = { engine, transport, tv, dev, setDevMode };
    renderAll();
    if (TE.Net) TE.Net.attachHost(TE.app);   // panel «Crear sala» (solo si hay servidor)
  }

  const errors = [];
  function reportError(e) {
    console.error(e); errors.push(String(e && e.stack || e));
    if (TE.app && TE.app.dev && TE.app.dev.isEnabled()) {
      const b = document.createElement('div'); b.className = 'js-error';
      b.textContent = 'Error: ' + (e && e.message || e); document.body.appendChild(b); setTimeout(() => b.remove(), 6000);
    }
  }
  window.addEventListener('error', ev => reportError(ev.error || ev.message));
  TE.errors = errors;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
