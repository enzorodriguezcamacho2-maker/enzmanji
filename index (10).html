<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tablero Encantado</title>
  <style>
/* ==========================================================================
   style.css — Escenario de la TV (1920×1080 escalado) y elementos comunes
   Dirección visual: selva de noche, tablero de madera antigua, latón y magia.
   ========================================================================== */
:root {
  --ink: #06120e;
  --moss: #0e2a21;
  --moss-2: #14392d;
  --wood: #2a1c11;
  --wood-2: #45301d;
  --brass: #e0b04a;
  --brass-d: #9a6f1f;
  --text: #eaf2e6;
  --muted: #9db3a5;
  --arcane: #9b6bff;
  --ember: #ff7a3d;
  --good: #3fcf8e;
  --bad: #ff5d6c;
  --chaos: #ff2e63;
  --font-display: 'Palatino Linotype', Palatino, 'Book Antiqua', 'URW Palladio L', Georgia, serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--font-ui); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.muted { color: var(--muted); }

#tv-viewport {
  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(1200px 700px at 20% 10%, #12402f 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 90%, #241048 0%, transparent 60%),
    linear-gradient(160deg, #061a13, #04100c 60%, #0a0816);
}
#stage { position: absolute; width: 1920px; height: 1080px; transform-origin: 0 0; }
#float-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
#float-layer > * { pointer-events: auto; }

/* ------------------------------ tablero ------------------------------ */
#board { position: absolute; left: 30px; top: 40px; width: 1200px; height: 1000px; }
.board-frame {
  position: absolute; inset: -18px; border-radius: 34px;
  background: linear-gradient(145deg, var(--wood-2), var(--wood) 55%, #1a1009);
  box-shadow: 0 0 0 3px var(--brass-d), 0 0 0 6px #1a1009, 0 30px 70px rgba(0,0,0,.65), inset 0 0 40px rgba(0,0,0,.5);
}
#tiles { position: absolute; inset: 0; }
.tile {
  position: absolute; width: 100px; height: 100px; padding: 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.tile::before {
  content: ''; position: absolute; inset: 4px; border-radius: 16px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--tc) 85%, #fff 8%), color-mix(in srgb, var(--tc) 55%, #000));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), inset 0 -8px 14px rgba(0,0,0,.28), 0 3px 6px rgba(0,0,0,.45);
}
.tile > * { position: relative; }
.tile .ti { font-size: 42px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
.tile .tn { font-size: 14px; font-weight: 800; letter-spacing: .04em; color: rgba(255,255,255,.88); text-shadow: 0 1px 2px rgba(0,0,0,.6); margin-top: 2px; }
.tile .goal { position: absolute; right: 6px; top: 4px; font-size: 24px; filter: drop-shadow(0 0 6px gold); }
.tile.t-normal::before { background: linear-gradient(160deg, #2f5c49, #1f3f33); }
.tile.t-normal .ti { opacity: .55; font-size: 30px; }
.tile.t-start::before { background: linear-gradient(160deg, #f6d36b, #b78321); }
.tile.t-start .tn { color: #3a2704; text-shadow: none; }
.tile.here::before { box-shadow: inset 0 0 0 3px #fff, 0 0 0 4px var(--brass), 0 0 26px 6px rgba(224,176,74,.75); }
.tile.pop::before { animation: tilepop 1.4s ease-out; }
.tile.pop .ti { animation: iconpop 1.2s ease-out; }
@keyframes tilepop { 0% { filter: brightness(2.2); transform: scale(1.25); } 50% { transform: scale(1.1); } 100% { filter: none; transform: scale(1); } }
@keyframes iconpop { 0% { transform: scale(2.3) rotate(-14deg); } 60% { transform: scale(1.2) rotate(6deg); } 100% { transform: none; } }
.tile.t-curse .ti, .tile.t-chaos .ti { animation: wobble 3s ease-in-out infinite; }
.tile.t-roulette .ti { animation: spinslow 8s linear infinite; }
@keyframes wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
@keyframes spinslow { to { transform: rotate(360deg); } }
#tiles.chaosfx .tile::before { animation: chaospulse 1.6s ease-in-out infinite; }
#tiles.chaosfx .tile.t-coins .tn::after { content: ' ×2'; color: #ffd23f; }
@keyframes chaospulse { 0%,100% { filter: hue-rotate(0) saturate(1.1); } 50% { filter: hue-rotate(40deg) saturate(1.6) brightness(1.15); } }

/* ------------------------------ fichas ------------------------------ */
#tokens { position: absolute; inset: 0; pointer-events: none; }
.token {
  position: absolute; left: 0; top: 0; width: 52px; height: 52px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--pc) 45%, color-mix(in srgb, var(--pc) 55%, #000) 100%);
  border: 3px solid #fff; box-shadow: 0 6px 10px rgba(0,0,0,.55), 0 0 0 3px rgba(0,0,0,.35);
  display: grid; place-items: center; transition: transform .3s cubic-bezier(.3,.8,.3,1.2); z-index: 5;
}
.token .tk-face { font-size: 30px; line-height: 1; }
.token .tk-name { position: absolute; top: 54px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 800; padding: 1px 8px; border-radius: 9px; background: rgba(0,0,0,.72); white-space: nowrap; display: none; }
.token.active { z-index: 7; box-shadow: 0 0 0 4px var(--brass), 0 0 24px 8px rgba(224,176,74,.8), 0 6px 10px rgba(0,0,0,.55); }
.token.active .tk-name { display: block; }
.token.walking { animation: hopstep .32s ease-in-out infinite; }
.token.hop { animation: bighop .9s ease-out; }
@keyframes hopstep { 50% { margin-top: -10px; } }
@keyframes bighop { 30% { margin-top: -50px; filter: brightness(1.6); } 60% { margin-top: 0; } 75% { margin-top: -14px; } }

/* ------------------------------ centro del tablero ------------------------------ */
.tvc {
  position: absolute; left: 100px; top: 100px; width: 1000px; height: 800px; border-radius: 22px; overflow: hidden;
  background:
    radial-gradient(600px 380px at 50% 0%, rgba(255,255,255,.07), transparent 70%),
    linear-gradient(170deg, #0f3a2c, #0a2219 70%);
  box-shadow: inset 0 0 0 3px var(--brass-d), inset 0 0 60px rgba(0,0,0,.55);
}
.tvc.chaos { background: radial-gradient(600px 380px at 50% 0%, rgba(255,46,99,.22), transparent 70%), linear-gradient(170deg, #34103a, #170a24 70%); box-shadow: inset 0 0 0 3px var(--chaos), inset 0 0 70px rgba(255,46,99,.35); }
.tvc-inner { position: absolute; inset: 0; padding: 36px 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#chaos-bar { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
.chaos-banner { background: linear-gradient(90deg, transparent, rgba(255,46,99,.85) 12%, rgba(255,46,99,.85) 88%, transparent); padding: 6px 30px; font-weight: 800; font-size: 20px; letter-spacing: .02em; animation: chaosglow 1.6s ease-in-out infinite; }
@keyframes chaosglow { 50% { filter: brightness(1.35); } }
.tvc h2 { font-family: var(--font-display); margin: 0; font-weight: 800; }

.c-idle h2 { font-size: 54px; margin: 18px 0 6px; }
.idle-avatar { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; font-size: 86px; background: radial-gradient(circle at 35% 30%, #fff, var(--pc) 55%, color-mix(in srgb, var(--pc) 50%, #000)); border: 6px solid #fff; box-shadow: 0 0 50px color-mix(in srgb, var(--pc) 70%, transparent); animation: floaty 3s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-10px); } }
.dice-stage { margin: 22px 0 6px; min-height: 130px; display: grid; place-items: center; }
.dice-note { font-size: 30px; color: var(--muted); margin: 6px 0; min-height: 40px; }
.dice-note b { color: var(--brass); font-size: 48px; font-family: var(--font-display); }

.die { width: 120px; height: 120px; border-radius: 22px; padding: 14px; background: linear-gradient(145deg, #fff, #d8d4c8); box-shadow: 0 10px 0 #a9a18a, 0 18px 24px rgba(0,0,0,.55); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); place-items: center; }
.die i { width: 20px; height: 20px; border-radius: 50%; background: transparent; }
.die i.on { background: radial-gradient(circle at 35% 30%, #444, #111); }
.die.rolling { animation: dieroll .45s linear infinite; }
.die.tilt { transform: rotate(-12deg); }
@keyframes dieroll { 0% { transform: rotate(0) translateY(0); } 25% { transform: rotate(90deg) translateY(-18px); } 50% { transform: rotate(180deg) translateY(0); } 75% { transform: rotate(270deg) translateY(-12px); } 100% { transform: rotate(360deg) translateY(0); } }

/* lobby */
.c-lobby { gap: 18px; display: flex; flex-direction: column; align-items: center; width: 100%; }
.c-hero { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.c-hero h2 { font-size: 60px; }
.c-hero p { font-size: 24px; color: #c8d9cd; max-width: 780px; margin: 6px 0 0; line-height: 1.35; }
.hero-die { margin-bottom: 10px; }
.c-players { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; min-height: 56px; }
.pchip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 40px; font-weight: 700; font-size: 22px; background: color-mix(in srgb, var(--pc) 30%, #0a1a14); border: 2px solid var(--pc); }
.pchip em { font-style: normal; font-weight: 600; opacity: .85; font-size: 18px; }
.pchip.big { font-size: 28px; padding: 8px 18px; }
.pchip.out { opacity: .45; filter: grayscale(.8); }
.pchip.wait { opacity: .7; }
.pchip .x { margin-left: 4px; border: 0; background: rgba(0,0,0,.4); color: #fff; width: 30px; height: 30px; border-radius: 50%; font-size: 20px; line-height: 1; }
.addform { display: flex; gap: 10px; }
.addform input { font: inherit; font-size: 24px; padding: 10px 18px; width: 320px; border-radius: 14px; border: 2px solid var(--brass-d); background: #06130e; color: var(--text); }
.hint { color: var(--muted); font-size: 20px; margin: 0; }
.btn { font-size: 24px; font-weight: 800; padding: 12px 26px; border-radius: 14px; border: 0; background: linear-gradient(180deg, #2a6e55, #1d5240); color: #fff; box-shadow: 0 4px 0 #0e2e24, 0 8px 14px rgba(0,0,0,.4); }
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #0e2e24; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 34px; padding: 16px 44px; }
.btn.go { background: linear-gradient(180deg, #f3c653, #c58a1b); color: #2b1a02; box-shadow: 0 4px 0 #7b520a, 0 10px 20px rgba(0,0,0,.45); }
.btn.small { font-size: 20px; padding: 8px 18px; }

/* retos */
.c-challenge { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.c-head { display: flex; align-items: center; gap: 16px; font-size: 24px; font-weight: 700; flex-wrap: wrap; justify-content: center; }
.cat { background: color-mix(in srgb, var(--cat) 35%, #0a1a14); border: 2px solid var(--cat); padding: 4px 16px; border-radius: 30px; }
.diff { color: var(--brass); letter-spacing: 2px; font-size: 18px; } .diff s { text-decoration: none; opacity: .25; }
.kind { color: var(--muted); font-size: 20px; }
.reward { background: linear-gradient(180deg, #f6d36b, #b78321); color: #2b1a02; padding: 4px 18px; border-radius: 30px; font-weight: 800; }
.mods { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.mod { font-size: 17px; padding: 2px 12px; border-radius: 12px; background: rgba(155,107,255,.28); border: 1px solid var(--arcane); }
.c-question { font-size: 46px; line-height: 1.18; max-width: 880px; margin: 6px 0; }
.c-question.small { font-size: 34px; }
.c-options { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.c-options li { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 700; text-align: left; padding: 14px 20px; border-radius: 16px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14); }
.c-options li.gone { opacity: .2; text-decoration: line-through; }
.ol { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--brass); color: #2b1a02; font-weight: 900; font-size: 26px; }
.blanks { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
.blanks i { width: 30px; height: 6px; border-radius: 3px; background: var(--brass); opacity: .75; }
.hint-line { font-size: 24px; color: #c9e3d3; margin: 0; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
.c-timer { width: 100%; display: flex; align-items: center; gap: 16px; }
.timer-track { flex: 1; height: 16px; background: rgba(0,0,0,.45); border-radius: 10px; overflow: hidden; border: 2px solid rgba(255,255,255,.15); }
.timer-bar { height: 100%; width: 100%; transform-origin: left center; background: linear-gradient(90deg, #3fcf8e, #f3c653); border-radius: 8px; }
.timer-bar.low { background: linear-gradient(90deg, #ff5d6c, #ff9f43); animation: blink .6s linear infinite; }
@keyframes blink { 50% { opacity: .55; } }
.timer-num { font-family: var(--font-display); font-size: 34px; width: 56px; text-align: right; }
.aval-banner { display: flex; flex-direction: column; gap: 0; align-items: center; background: linear-gradient(90deg, transparent, rgba(255,122,61,.45), transparent); padding: 6px 80px; width: 100%; }
.aval-banner b { font-family: var(--font-display); font-size: 40px; color: #ffb36b; letter-spacing: .06em; }
.aval-banner span { font-size: 22px; }
.aval-banner .rocks { animation: rockfall 1.1s linear infinite; font-size: 26px; }
@keyframes rockfall { 0% { transform: translateY(-14px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
.mem-stage { height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.mem-sym { font-size: 170px; line-height: 1; animation: sympop .5s ease-out; }
@keyframes sympop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.mem-dots { display: flex; gap: 10px; } .mem-dots i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.2); } .mem-dots i.on { background: var(--brass); }
.mem-slots { display: flex; gap: 12px; margin: 30px 0; } .mem-slots i { width: 76px; height: 90px; border-radius: 16px; border: 3px dashed var(--brass); }
.draw-canvas { width: 560px; height: 560px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 6px var(--brass-d), 0 14px 30px rgba(0,0,0,.5); }
.c-challenge:has(.draw-canvas) .c-head, .c-challenge:has(.draw-canvas) .c-timer { margin: 0; }

/* tienda en la TV */
.c-shop { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.c-shop h2 { font-size: 42px; }
.shop-grid { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.shop-grid li { background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14); border-radius: 14px; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.shop-grid li.sold { opacity: .35; }
.shop-grid .si { font-size: 34px; } .shop-grid b { font-size: 20px; } .shop-grid .sp { color: var(--brass); font-weight: 800; font-size: 22px; } .shop-grid small { font-size: 14px; color: var(--muted); line-height: 1.2; } .shop-grid em { font-style: normal; font-size: 13px; color: #c9e3d3; }
.shop-grid .sp s { opacity: .5; font-size: 16px; }

/* ruleta */
.c-roulette { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.c-roulette h2 { font-size: 38px; }
.wheel-wrap { position: relative; width: 500px; height: 500px; margin-top: 30px; filter: drop-shadow(0 12px 22px rgba(0,0,0,.6)); }
.wheel-svg { width: 100%; height: 100%; }
.wheel-wrap::before { content: ''; position: absolute; inset: 6px; border-radius: 50%; box-shadow: 0 0 0 10px var(--brass), 0 0 0 14px #1b1208, 0 0 50px rgba(224,176,74,.5); pointer-events: none; }
.wheel-wrap.spinning::before { animation: glowspin 0.7s ease-in-out infinite alternate; }
@keyframes glowspin { to { box-shadow: 0 0 0 10px #ffe08a, 0 0 0 14px #1b1208, 0 0 90px rgba(255,224,138,.9); } }
.wheel-pointer { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); border-left: 22px solid transparent; border-right: 22px solid transparent; border-top: 46px solid #ff3b57; filter: drop-shadow(0 4px 4px rgba(0,0,0,.6)); }
.wheel-jackpot { font-size: 30px; } .wheel-jackpot b { color: #ff7a8a; }

/* escudo, caos, resultado */
.c-shield .big-ico, .c-chaos .big-ico { font-size: 130px; }
.c-shield h2 { font-size: 56px; color: #c9a8ff; margin-top: 6px; }
.c-shield p { font-size: 28px; margin: 6px 0; } .shield-q { font-size: 30px !important; color: #9fd0ff; margin-top: 16px !important; }
.c-shield .c-timer { margin-top: 20px; }
.c-chaos { position: relative; } .c-chaos h2 { font-size: 54px; color: #ff6f91; } .c-chaos ul { list-style: none; padding: 0; margin: 18px 0 0; font-size: 28px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.swirl { position: absolute; inset: -200px; background: conic-gradient(from 0deg, transparent, rgba(255,46,99,.25), transparent 30%, rgba(155,107,255,.25), transparent 60%, rgba(255,122,61,.22), transparent); animation: swirl 6s linear infinite; z-index: -1; }
@keyframes swirl { to { transform: rotate(360deg); } }
.c-result .r-ico { font-size: 110px; } .c-result h2 { font-size: 54px; margin-top: 8px; } .c-result p { font-size: 32px; margin: 10px 0 0; }
.c-result.ok h2 { color: var(--good); } .c-result.ko h2 { color: var(--bad); }
.c-result { animation: resultin .45s cubic-bezier(.2,1.3,.4,1); }
@keyframes resultin { from { transform: scale(.7); opacity: 0; } }
.r-answer { margin-top: 20px; font-size: 30px; padding: 10px 28px; border-radius: 16px; background: rgba(255,255,255,.1); } .r-answer b { color: var(--brass); }
.c-end h2 { font-size: 56px; margin-bottom: 20px; color: var(--brass); }
.podium { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-direction: column; gap: 10px; width: 640px; }
.podium li { display: grid; grid-template-columns: 56px 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 18px; border-radius: 16px; background: color-mix(in srgb, var(--pc) 24%, #0a1a14); border: 2px solid var(--pc); font-size: 26px; text-align: left; }
.podium .pm { font-size: 36px; } .podium .pa { font-size: 38px; } .podium li span:last-child { font-size: 20px; color: #d6e6dc; }
.end-btns { display: flex; gap: 14px; }
.confetti { position: absolute; inset: 0; background-image: radial-gradient(circle, #ffd23f 3px, transparent 4px), radial-gradient(circle, #ff5d73 3px, transparent 4px), radial-gradient(circle, #4cc9f0 3px, transparent 4px); background-size: 90px 110px, 130px 90px, 70px 150px; animation: confall 5s linear infinite; opacity: .5; z-index: -1; }
@keyframes confall { to { background-position: 0 600px, 0 500px, 0 700px; } }

/* ------------------------------ panel lateral ------------------------------ */
#side { position: absolute; left: 1262px; top: 40px; width: 628px; height: 1000px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; justify-content: space-between; align-items: center; }
.brand-title { display: flex; align-items: center; gap: 16px; }
.brand-mark { font-size: 54px; color: var(--brass); text-shadow: 0 0 20px rgba(224,176,74,.8); }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 1; letter-spacing: .03em; color: #f6e3ac; text-shadow: 0 3px 0 #5a3d0a, 0 0 24px rgba(224,176,74,.35); }
.icon-btn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--brass-d); background: rgba(0,0,0,.35); font-size: 26px; }
.jackpot { display: flex; align-items: center; gap: 12px; padding: 10px 22px; border-radius: 18px; background: linear-gradient(90deg, rgba(255,46,99,.28), rgba(155,107,255,.2)); border: 2px solid rgba(255,93,115,.6); font-size: 26px; }
.jp-gem { font-size: 34px; } .jp-label { font-weight: 700; color: #ffc2cb; } .jp-val { font-family: var(--font-display); font-size: 44px; margin-left: auto; color: #fff; } .jp-coin { font-size: 28px; }
.jackpot.bump { animation: bump .6s ease-out; } @keyframes bump { 40% { transform: scale(1.08); filter: brightness(1.5); } }
.turncard { display: flex; align-items: center; gap: 18px; padding: 10px 20px; border-radius: 18px; background: linear-gradient(90deg, rgba(224,176,74,.22), rgba(224,176,74,.06)); border: 2px solid var(--brass-d); min-height: 100px; }
.tc-avatar { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 46px; background: radial-gradient(circle at 35% 30%, #fff, var(--pc) 55%, color-mix(in srgb, var(--pc) 50%, #000)); border: 4px solid #fff; flex: none; }
.tc-text { display: flex; flex-direction: column; } .tc-label { font-size: 17px; color: var(--muted); } .tc-text b { font-family: var(--font-display); font-size: 36px; line-height: 1.1; } .tc-step { font-size: 19px; color: #d6e6dc; }
.tc-round { margin-left: auto; text-align: center; font-size: 16px; color: var(--muted); } .tc-round b { font-family: var(--font-display); font-size: 38px; color: var(--text); }

#cam .tile .ti { display: none; }
#cam .tile.t-start .ti, #cam .tile.pop .ti { display: block; position: absolute; top: -40px; font-size: 46px; }
#cam .tile.t-start::before { background: radial-gradient(ellipse at 40% 30%, #ffe28e, #c58f2b); }
#cam .tile.pop::before { background: radial-gradient(ellipse at 40% 30%, color-mix(in srgb, var(--tc) 65%, #fff), var(--tc)); }

#cam .tile .goal { right: 2px; top: -26px; }

/* ==========================================================================

   * No toca el DOM ni usa el reloj directamente (se inyecta), así que puede

  'use strict';

  const PASSABLE = ['choice', 'open', 'riddle'];
  const QUESTION_KINDS = ['choice', 'open', 'riddle', 'speed'];

  function createEngine(opts) {
    opts = opts || {};

    const allowDev = opts.allowDev !== false;
    let clock = opts.now || (() => Date.now());

    const listeners = new Set();
    let state;

    /* ------------------------------ aleatoriedad ------------------------------ */
    function rnd() {
      seed = (seed + 0x6D2B79F5) | 0;

    const now = () => clock();

    /* ------------------------------ estado ------------------------------ */
    function freshState() {
      const stock = {};
      Data.SHOP.forEach(s => { stock[s.key] = s.stock; });
      return {
        v: 1, phase: 'lobby', players: [], playerSeq: 0,
        turn: null, round: 0, pending: null, sched: null,
        jackpot: S.jackpot.start, shopStock: stock,
        chaos: { used: false, active: false, activatorId: null, startDist: 0, endDist: 0 },
        dice: null, move: null, landed: null, result: null, announce: null,
        log: [], logSeq: 0, seqCounter: 0, winnerId: null, usedQ: {}, forcedDice: null

    }
    state = freshState();

    const P = id => state.players.find(p => p.id === id);
    const cur = () => (state.turn ? P(state.turn.playerId) : null);
    const nextSeq = () => ++state.seqCounter;
    const dirtyEmit = () => { listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); };

    function log(msg, o) {
      o = o || {};
      state.logSeq++;
      state.log.push({ s: state.logSeq, t: now(), msg, kind: o.kind || 'info', icon: o.icon || null });

    function setResult(r) { state.result = Object.assign({ seq: nextSeq(), until: now() + S.resultMs }, r); }
    function sched(kind, ms) { state.sched = { kind, at: now() + ms }; }

    function makePlayer(name, id, lookIdx) {
      const used = state.players.map(p => p.lookIdx);
      if (lookIdx == null) { const free = Data.PLAYER_LOOKS.map((_, i) => i).filter(i => !used.includes(i)); lookIdx = free.length ? free[Math.floor(Math.random() * free.length)] : used.length; }
      const look = Data.PLAYER_LOOKS[lookIdx % Data.PLAYER_LOOKS.length];

        id: id || ('p' + state.playerSeq), name: String(name || ('Jugador ' + state.playerSeq)).slice(0, 14),

    /* ------------------------------ efectos ------------------------------ */

      const l = Math.max(0, Math.min(p.coins, n));

    function grantItem(p, key, force) {
      const def = Data.SHOP_BY_KEY[key];

        p.cards.push(key); return true;

      if (!force && itemCount(p, key) >= def.carry) return false;

    }
    const randomCardKey = () => pick(Data.SHOP.filter(s => s.kind === 'card')).key;

    /* ------------------------------ preguntas ------------------------------ */
    function pickFrom(pool, minDiff, maxDiff) {
      minDiff = minDiff || 1; maxDiff = maxDiff || 3;
      const used = state.usedQ;
      const ok = q => (q.diff || 1) >= minDiff && (q.diff || 1) <= maxDiff;
      let avail = pool.filter(q => !used[q.id] && ok(q));
      if (!avail.length) {
        pool.forEach(q => { delete used[q.id]; });
        avail = pool.filter(ok);
        if (!avail.length) avail = pool.slice();
      }
      const r = rnd();
      const target = Math.min(maxDiff, Math.max(minDiff, r < 0.4 ? 1 : r < 0.8 ? 2 : 3));
      let cand = avail.filter(q => (q.diff || 1) === target);
      if (!cand.length) cand = avail;
      const q = pick(cand);
      used[q.id] = true;
      return q;
    }
    const minDifficulty = () => (state.chaos.active ? S.chaos.minDifficulty : 1);

    function buildChoice(item) {
      const options = shuffle([item.correct].concat(item.wrong));
      return {
        q: { type: 'choice', id: item.id, cat: item.cat, diff: item.diff, text: item.text, options },
        secret: { correctIdx: options.indexOf(item.correct) }
      };
    }
    function buildText(item) {
      return {
        q: { type: 'text', id: item.id, cat: item.cat, diff: item.diff, text: item.text, length: item.answer.length },
        secret: { answers: [item.answer].concat(item.alts || []) }

      if (takeEffect(p, 'silence')) { m.timeMult *= 0.6; m.labels.push('Silencio mágico'); }
      if (takeEffect(p, 'hourglass')) { m.timeMult *= 1.5; m.labels.push('Reloj de arena'); }
      if (takeEffect(p, 'hex')) { m.timeMult *= 0.7; m.rewardPlus -= 1; m.labels.push('Mal de ojo'); }
      if (takeEffect(p, 'badLuck')) { m.rewardMult *= 0.5; m.labels.push('Mala suerte'); }
      if (takeEffect(p, 'luckyCoin')) { m.rewardMult *= 2; m.labels.push('Moneda de la suerte'); }
      if (state.chaos.active) { m.timeMult *= S.chaos.timeMult; m.rewardMult *= S.chaos.rewardMult; m.labels.push('Modo Caos'); }
      return m;
    }
    const calcReward = (base, m) => Math.max(1, Math.round(base * m.rewardMult) + m.rewardPlus);
    const calcMs = (sec, m) => Math.max(4000, Math.round(sec * 1000 * m.timeMult));

    function startChallenge(pid, o) {
      o = o || {};
      const p = P(pid);
      const kind = o.kind || weightedPick(Object.keys(CHALLENGE_WEIGHTS), k => CHALLENGE_WEIGHTS[k]);
      const mods = challengeMods(p);
      const minD = minDifficulty();
      const t0 = now();
      const pd = {
        type: 'challenge', kind, playerId: pid, origin: o.origin || 'tile', status: 'answering',
        mods: mods.labels, hintUsed: false, hidden: [], hintText: null, secret: {}, startedAt: t0
      };
      state.turn.step = 'resolving';
      if (kind === 'choice' || kind === 'speed') {
        const item = kind === 'choice' ? pickFrom(Data.CHOICE, minD) : pickFrom(Data.SPEED, minD);
        const b = buildChoice(item); pd.q = b.q; pd.secret = b.secret;
        pd.q.cat = item.cat;
        pd.reward = calcReward(S.rewards[kind][item.diff - 1], mods);
        pd.total = calcMs(kind === 'speed' ? S.seconds.speed : S.seconds.choice, mods);
      } else if (kind === 'open' || kind === 'riddle') {
        const item = kind === 'open' ? pickFrom(Data.OPEN, minD) : pickFrom(Data.RIDDLES, minD);
        const b = buildText(item); pd.q = b.q; pd.secret = b.secret;
        pd.reward = calcReward(S.rewards[kind][item.diff - 1], mods);
        pd.total = calcMs(kind === 'open' ? S.seconds.open : S.seconds.riddle, mods);
      } else if (kind === 'memory') {
        const r = rnd();
        const d = Math.max(minD, r < 0.5 ? 1 : r < 0.85 ? 2 : 3);
        const len = Data.MEMORY_LENGTH[d - 1];
        const seq = []; for (let i = 0; i < len; i++) seq.push(pick(Data.MEMORY_SYMBOLS));
        pd.q = { type: 'memory', cat: 'cultura', diff: d, text: 'Memoriza la secuencia', symbols: Data.MEMORY_SYMBOLS, length: len };
        pd.secret = { seq };
        pd.phase = 'show';
        pd.reward = calcReward(S.rewards.memory[d - 1], mods);
        pd.inputMs = calcMs(S.seconds.memoryInput, mods);
        pd.total = len * S.memoryShowMsPerSymbol + 1500;
      } else if (kind === 'draw') {
        const w = pickFrom(Data.WORDS.map(x => Object.assign({ diff: 1 }, x)), 1, 1);
        pd.q = { type: 'draw', cat: 'ocio', diff: 1, text: 'Reto de dibujo' };
        pd.secret = { word: w.word, alts: w.alts };
        pd.phase = 'draw';
        pd.strokes = []; pd.guesses = {}; pd.guessMs = S.seconds.guess * 1000;
        pd.reward = calcReward(S.rewards.draw, mods);
        pd.total = calcMs(S.seconds.draw, mods);
      }
      pd.deadline = t0 + pd.total;
      state.pending = pd;
      if (o.avalanche) passToAvalanche(pd, p);
      else log('❓ ' + p.name + ' recibe un reto (' + kindName(kind) + ').', { kind: 'challenge' });
    }
    const kindName = k => ({ choice: 'pregunta', open: 'pregunta abierta', riddle: 'acertijo', speed: 'rapidez', memory: 'memoria', draw: 'dibujo' }[k] || k);

    function passToAvalanche(pd, p) {
      pd.status = 'avalanche'; pd.excluded = [p.id]; pd.eliminated = [];
      pd.hidden = []; pd.hintText = null;
      pd.avalancheReward = S.avalancheReward;
      pd.total = S.avalancheSeconds * 1000; pd.deadline = now() + pd.total;
      announce({ kind: 'avalanche', icon: '🏔️', title: '¡AVALANCHA!', text: p.name + ' pasa. La misma pregunta para todos los demás.' });
      log('🏔️ ¡Avalancha! ' + p.name + ' pasa la pregunta.', { kind: 'avalanche' });
    }

    function winChallenge(pd) {
      const p = P(pd.playerId);
      state.pending = null;                         // se cierra ANTES de pagar: nunca se paga dos veces
      p.coins += pd.reward; p.stats.won++;
      setResult({ kind: 'challenge', ok: true, playerId: p.id, title: '¡Correcto!', text: p.name + ' gana ' + pd.reward + ' 🪙', answer: pd.q.type === 'draw' || pd.q.type === 'memory' ? null : answerText(pd) });
      log('✅ ' + p.name + ' supera el reto: +' + pd.reward + ' 🪙.', { kind: 'good' });
      finishInteraction(pd.origin);
    }
    function failChallenge(pd, reason) {
      const p = P(pd.playerId);
      state.pending = null;
      p.stats.failed++; state.jackpot += S.jackpot.onFail;
      const ans = pd.q.type === 'draw' || pd.q.type === 'memory' ? null : answerText(pd);
      setResult({ kind: 'challenge', ok: false, playerId: p.id, title: reason === 'timeout' ? '¡Tiempo!' : 'Fallaste', text: p.name + ' no supera el reto. El bote crece +' + S.jackpot.onFail, answer: ans });
      log('❌ ' + p.name + (reason === 'timeout' ? ' se queda sin tiempo.' : ' falla el reto.') + ' (+' + S.jackpot.onFail + ' al bote)', { kind: 'bad' });
      finishInteraction(pd.origin);
    }
    function closeAvalanche(winnerId) {
      const pd = state.pending;
      state.pending = null;
      const passer = P(pd.playerId);
      if (winnerId) {
        const w = P(winnerId);
        w.coins += pd.avalancheReward; w.stats.avalanches++;
        setResult({ kind: 'avalanche', ok: true, playerId: w.id, title: '¡' + w.name + ' se lleva la Avalancha!', text: '+' + pd.avalancheReward + ' 🪙', answer: answerText(pd) });
        log('🏔️ ' + w.name + ' gana la Avalancha: +' + pd.avalancheReward + ' 🪙.', { kind: 'good' });
      } else {
        state.jackpot += S.jackpot.onFail;
        setResult({ kind: 'avalanche', ok: false, playerId: null, title: 'Avalancha sin ganador', text: 'Nadie acertó. El bote crece +' + S.jackpot.onFail, answer: answerText(pd) });
        log('🏔️ Nadie acierta la Avalancha de ' + passer.name + '.', { kind: 'bad' });
      }
      finishInteraction(pd.origin);
    }

    function closeDraw(winnerId) {
      const pd = state.pending;
      state.pending = null;
      const drawer = P(pd.playerId);
      if (winnerId) {
        const w = P(winnerId);
        w.coins += S.rewards.draw; drawer.coins += pd.reward; drawer.stats.won++;
        setResult({ kind: 'draw', ok: true, playerId: w.id, title: '¡' + w.name + ' lo adivina!', text: w.name + ' +' + S.rewards.draw + ' 🪙 · ' + drawer.name + ' +' + pd.reward + ' 🪙', answer: pd.secret.word });
        log('🎨 ' + w.name + ' adivina «' + pd.secret.word + '».', { kind: 'good' });
      } else {
        setResult({ kind: 'draw', ok: false, playerId: drawer.id, title: 'Nadie lo adivinó', text: 'Era…', answer: pd.secret.word });
        log('🎨 Nadie adivina el dibujo de ' + drawer.name + '.', { kind: 'bad' });
      }
      finishInteraction(pd.origin);
    }
    function sanitizeStrokes(strokes) {
      if (!Array.isArray(strokes)) return null;
      const out = []; let pts = 0;
      for (const s of strokes.slice(0, 400)) {
        if (!s || !Array.isArray(s.p)) continue;
        const p = [];
        for (const pt of s.p.slice(0, 1500)) {
          if (!Array.isArray(pt)) continue;
          const x = Math.round(Number(pt[0])), y = Math.round(Number(pt[1]));
          if (!isFinite(x) || !isFinite(y)) continue;
          p.push([Math.max(0, Math.min(1000, x)), Math.max(0, Math.min(1000, y))]);
        }
        pts += p.length;
        if (pts > 20000) break;
        if (p.length) out.push({ c: String(s.c || '#000').slice(0, 9), w: Math.max(1, Math.min(60, Number(s.w) || 6)), e: !!s.e, p });
      }
      return out;
    }

    /* ------------------------------ colectivo ------------------------------ */
    function startCollective(origin) {
      const item = pickFrom(Data.CHOICE, 1, 2);
      const b = buildChoice(item);
      const t0 = now(), total = S.seconds.collective * 1000;
      state.turn.step = 'resolving';
      state.pending = { type: 'collective', origin, q: b.q, secret: b.secret, answers: {}, hidden: [], startedAt: t0, total, deadline: t0 + total,
        reward: S.collectiveReward, penalty: S.collectivePenalty };
      announce({ kind: 'collective', icon: Data.WIZARD.icon, title: '¡Reto de grupo!', text: 'Todos deben acertar antes de que acabe la cuenta atrás.' });
      log('👥 Reto de grupo: ¡todos a responder!', { kind: 'event' });
    }
    function closeCollective() {
      const pd = state.pending;
      state.pending = null;
      const all = state.players.every(p => pd.answers[p.id] && pd.answers[p.id].correct);
      if (all) {
        state.players.forEach(p => { p.coins += pd.reward; });
        setResult({ kind: 'collective', ok: true, title: '¡El grupo lo consigue!', text: 'Todos ganan ' + pd.reward + ' 🪙', answer: answerText(pd) });
        log('👥 El grupo supera el reto: +' + pd.reward + ' 🪙 cada uno.', { kind: 'good' });
      } else {
        state.players.forEach(p => { loseCoins(p, pd.penalty); });
        setResult({ kind: 'collective', ok: false, title: 'El grupo falla', text: 'Todos pierden hasta ' + pd.penalty + ' 🪙 (van al bote)', answer: answerText(pd) });
        log('👥 El grupo falla: −' + pd.penalty + ' 🪙 cada uno (al bote).', { kind: 'bad' });
      }
      finishInteraction(pd.origin);
    }

    /* ------------------------------ tienda ------------------------------ */
    const discount = () => (state.chaos.active ? S.chaos.shopDiscount : 0);
    const priceOf = key => Math.max(1, Math.ceil(Data.SHOP_BY_KEY[key].price * (1 - discount())));
    function shopStatus(pid) {
      const p = P(pid);
      if (state.phase !== 'playing') return { ok: false, reason: 'La partida no está en marcha.' };
      if (hasEffect(p, 'lockShop')) return { ok: false, reason: 'Tienda cerrada por un Cerrojo.' };
      const pd = state.pending;
      if (pd && pd.type === 'shop' && pd.playerId === pid) return { ok: true };
      if (!pd && !state.sched && state.turn.step === 'roll') return { ok: true };
      return { ok: false, reason: 'Ahora no se puede comprar: hay un reto o suceso en marcha.' };
    }
    function buyCheck(pid, key) {
      const def = Data.SHOP_BY_KEY[key];
      if (!def) return { ok: false, reason: 'Ese objeto no existe.' };
      const st = shopStatus(pid);
      if (!st.ok) return st;
      const p = P(pid);
      if (state.shopStock[key] <= 0) return { ok: false, reason: 'Agotado.' };
      if (p.coins < priceOf(key)) return { ok: false, reason: 'Te faltan ' + (priceOf(key) - p.coins) + ' 🪙.' };
      if (def.kind === 'card' && p.cards.length >= S.maxHandCards) return { ok: false, reason: 'Tu mano está llena (' + S.maxHandCards + ' cartas).' };
      if (def.kind === 'item' && itemCount(p, key) >= def.carry) return { ok: false, reason: 'Ya llevas el máximo (' + def.carry + ').' };
      return { ok: true };
    }
    function openShop(pid, origin) {
      const p = P(pid);
      state.turn.step = 'resolving';
      if (hasEffect(p, 'lockShop')) {
        log('🔒 La tienda está cerrada para ' + p.name + '.');
        return finishInteraction(origin);
      }
      const t0 = now(), total = S.seconds.shop * 1000;
      state.pending = { type: 'shop', playerId: pid, origin, startedAt: t0, total, deadline: t0 + total };
      log('🛒 ' + p.name + ' entra en la tienda.');
    }

    /* ------------------------------ ruleta ------------------------------ */
    function startRoulette(pid, origin) {
      const t0 = now(), total = S.seconds.roulette * 1000;
      state.turn.step = 'resolving';
      state.pending = { type: 'roulette', playerId: pid, origin, status: 'ready', startedAt: t0, total, deadline: t0 + total, resultIndex: null };
      log('🎡 ' + P(pid).name + ' va a girar la ruleta. Bote: ' + state.jackpot + ' 🪙.', { kind: 'event' });
    }
    function doSpin() {
      const pd = state.pending;
      pd.status = 'spinning';
      pd.resultIndex = rint(0, Data.ROULETTE_WHEEL.length - 1);
      pd.spinSeq = nextSeq();
      pd.startedAt = now(); pd.total = S.rouletteSpinMs; pd.deadline = now() + S.rouletteSpinMs;
    }
    function finishRoulette() {
      const pd = state.pending;
      state.pending = null;                         // el premio se concede una sola vez
      const p = P(pd.playerId);
      const id = Data.ROULETTE_WHEEL[pd.resultIndex];
      const pr = Data.ROULETTE_PRIZES[id];
      const text = applyPrize(p, id);
      setResult({ kind: 'roulette', ok: id !== 'penalty', playerId: p.id, title: pr.icon + ' ' + pr.text, text: p.name + ': ' + text, prize: id });
      log('🎡 ' + p.name + ' obtiene: ' + pr.text + '.', { kind: id === 'penalty' ? 'bad' : 'good' });
      finishInteraction(pd.origin);
    }
    function applyPrize(p, id) {
      switch (id) {
        case 'c3': p.coins += 3; return '+3 🪙';
        case 'c6': p.coins += 6; return '+6 🪙';
        case 'card': {
          if (grantItem(p, randomCardKey(), false)) return 'recibe una carta';
          p.coins += 3; return 'mano llena: +3 🪙';
        }
        case 'extra':
          if (state.turn && state.turn.playerId === p.id && !state.turn.isExtra && !hasEffect(p, 'extraRoll')) {
            addEffect(p, 'extraRoll'); return 'tirará otra vez al acabar el turno';
          }
          p.coins += 3; return 'sin tirada posible: +3 🪙';
        case 'shield':
          if (grantItem(p, 'shield', false)) return 'recibe un escudo';
          p.coins += 2; return 'ya lleva el máximo de escudos: +2 🪙';
        case 'penalty': { const l = loseCoins(p, 3); return '−' + l + ' 🪙 (al bote)'; }
        case 'jackpot': { const j = state.jackpot; p.coins += j; state.jackpot = S.jackpot.start; return '¡se lleva el bote de ' + j + ' 🪙!'; }
        case 'mystery': {
          const m = weightedPick(Data.MYSTERY_TABLE, x => x.w);
          if (m.kind === 'coins') { p.coins += m.amount; return 'premio misterioso: +' + m.amount + ' 🪙'; }
          if (m.kind === 'card') {
            if (grantItem(p, randomCardKey(), false)) return 'premio misterioso: una carta';
            p.coins += 3; return 'premio misterioso: +3 🪙';
          }
          if (grantItem(p, m.key, false)) return 'premio misterioso: ' + Data.SHOP_BY_KEY[m.key].name;
          p.coins += 3; return 'premio misterioso: +3 🪙';
        }
      }
      return '';
    }

    /* ------------------------------ maldiciones ------------------------------ */
    function leader() {
      const sorted = state.players.slice().sort((a, b) => b.dist - a.dist);
      return { first: sorted[0], second: sorted[1] };
    }
    function curseAllowed(c) {
      if (c.id === 'leader') { const l = leader(); return !!l.second && l.first.dist - l.second.dist >= 5; }
      if (c.id === 'swap') return swapPossible();
      return true;
    }
    function swapPossible() { return state.players.length >= 2; }
    function pickCurse(filter) {
      const list = Data.CURSES.filter(c => c.weight > 0 && curseAllowed(c) && (!filter || filter(c)));
      return weightedPick(list, c => c.weight);
    }
    function tileCurse(p) {
      const c = pickCurse();
      const target = c.id === 'leader' ? leader().first : p;
      startCurses([{ curseId: c.id, targetId: target.id, sourceId: p.id }], 'tile');
    }
    function startCurses(apps, origin) {
      const c = Data.CURSE_BY_ID[apps[0].curseId];
      const scope = apps.length === 1 ? 'single' : (apps.length >= state.players.length ? 'all' : 'multi');
      const names = apps.map(a => P(a.targetId).name).join(', ');
      announce({ kind: 'curse', scope, curseId: c.id, icon: c.icon, title: c.name,
        text: scope === 'all' ? '¡Maldición colectiva sobre todos!' : scope === 'multi' ? 'Maldición doble: ' + names : 'Cae sobre ' + names,
        targets: apps.map(a => a.targetId) });
      log(c.icon + ' ' + c.name + ' (' + (scope === 'single' ? 'individual' : scope === 'multi' ? 'varios' : 'colectiva') + '): ' + names + '.', { kind: 'curse' });
      if (state.turn) state.turn.step = 'resolving';
      processCurses(apps.slice(), origin, scope);
    }
    function processCurses(queue, origin, scope) {
      while (queue.length) {
        const app = queue[0];
        const t = P(app.targetId);
        if (itemCount(t, 'shield') > 0) {
          const t0 = now(), total = S.seconds.shield * 1000;
          state.pending = { type: 'shield', playerId: t.id, curseId: app.curseId, queue, origin, scope, startedAt: t0, total, deadline: t0 + total };
          return;
        }
        applyCurseNow(app);
        queue.shift();
      }
      finishInteraction(origin);
    }
    function applyCurseNow(app) {
      const c = Data.CURSE_BY_ID[app.curseId];
      const t = P(app.targetId);
      let msg = '';
      switch (c.id) {
        case 'leadFeet': addEffect(t, 'leadFeet'); msg = 'su próxima tirada avanza 2 casillas menos'; break;
        case 'silence': addEffect(t, 'silence'); msg = 'tendrá menos tiempo en su próximo reto'; break;
        case 'dice': addEffect(t, 'hauntedDice'); msg = 'su próxima tirada será extrema'; break;
        case 'badLuck': addEffect(t, 'badLuck'); msg = 'su próximo reto da la mitad de monedas'; break;
        case 'leader': addEffect(t, 'weight'); msg = 'avanzará 1 casilla menos durante 2 turnos'; break;
        case 'pockets': { const l = loseCoins(t, 3); msg = 'pierde ' + l + ' 🪙 (al bote)'; break; }
        case 'chest':
          if (rnd() < 0.5) { t.coins += 4; msg = 'el cofre estaba lleno: +4 🪙'; }
          else { const l = loseCoins(t, 3); msg = 'el cofre muerde: −' + l + ' 🪙 (al bote)'; }
          break;
        case 'portal': {
          const off = pick([-4, -3, -2, 2, 3, 4]);
          const to = Math.max(0, Math.min(S.goalDistance - 1, t.dist + off));
          if (to === t.dist) msg = 'el portal no logra moverlo';
          else { const moved = to - t.dist; teleport(t, to, 'portal'); msg = 'el portal lo lleva ' + (moved > 0 ? 'adelante' : 'atrás') + ' ' + Math.abs(moved) + ' casillas'; }
          break;
        }
        case 'swap': {
          const others = state.players.filter(x => x.id !== t.id && x.dist < S.goalDistance - 8);
          if (t.dist >= S.goalDistance - 8 || !others.length) { msg = 'el hechizo falla: están demasiado cerca de la meta'; break; }
          const o = pick(others);
          const a = t.dist, b = o.dist;
          teleport(t, b, 'swap'); teleport(o, a, 'swap');
          msg = 'intercambia su posición con ' + o.name;
          break;
        }
      }
      log(c.icon + ' ' + t.name + ': ' + msg + '.', { kind: 'curse' });
    }
    function resolveShield(use) {
      const pd = state.pending;
      const app = pd.queue[0];
      const t = P(app.targetId);
      const c = Data.CURSE_BY_ID[app.curseId];
      if (use) {
        t.items.shield = itemCount(t, 'shield') - 1;
        if (t.items.shield <= 0) delete t.items.shield;
        log('🛡️ ' + t.name + ' bloquea ' + c.name + ' con un escudo.', { kind: 'good' });
        setResult({ kind: 'shield', ok: true, playerId: t.id, title: '🛡️ ¡Maldición bloqueada!', text: t.name + ' gasta un escudo' });
      } else applyCurseNow(app);
      pd.queue.shift();
      state.pending = null;
      processCurses(pd.queue, pd.origin, pd.scope);
    }

    /* ------------------------------ sucesos ------------------------------ */
    function tileEvent(p) {
      const valid = Data.EVENTS.filter(e => {
        if (e.id === 'chaos') return !state.chaos.used && state.round >= S.chaos.minRoundForEvent;
        if (e.id === 'curseSome') return state.players.length >= 3;
        if (e.id === 'swap') return swapPossible();
        return true;
      });
      const ev = weightedPick(valid, e => e.w);
      state.turn.step = 'resolving';
      switch (ev.id) {
        case 'collective': return startCollective('tile');
        case 'curseOne': {
          const c = pickCurse(x => !x.special && x.id !== 'leader');
          const t = pick(state.players);
          return startCurses([{ curseId: c.id, targetId: t.id, sourceId: p.id }], 'tile');
        }
        case 'curseSome': {
          const c = pickCurse(x => !x.special && x.id !== 'leader');
          const two = state.players.slice().sort((a, b) => b.coins - a.coins).slice(0, 2);
          return startCurses(two.map(t => ({ curseId: c.id, targetId: t.id, sourceId: p.id })), 'tile');
        }
        case 'curseAll': {
          const c = pickCurse(x => x.mild);
          return startCurses(state.players.map(t => ({ curseId: c.id, targetId: t.id, sourceId: p.id })), 'tile');
        }
        case 'swap': {
          const t = pick(state.players);
          return startCurses([{ curseId: 'swap', targetId: t.id, sourceId: p.id }], 'tile');
        }
        case 'chaos': return startChaos(p.id, 'tile');
        default: { // gift
          announce({ kind: 'event', icon: Data.WIZARD.icon, title: 'Regalo del mago', text: Data.WIZARD.name + ' sonríe a ' + p.name });
          let txt;
          if (grantItem(p, randomCardKey(), false)) txt = 'recibe una carta';
          else { p.coins += 4; txt = 'mano llena: +4 🪙'; }
          log('🎁 Regalo del mago: ' + p.name + ' ' + txt + '.', { kind: 'good' });
          setResult({ kind: 'gift', ok: true, playerId: p.id, title: '🎁 Regalo del mago', text: p.name + ' ' + txt });
          return finishInteraction('tile');
        }
      }
    }

    /* ------------------------------ Modo Caos ------------------------------ */
    function startChaos(pid, origin) {
      if (state.chaos.used) return err('El Modo Caos ya se ha usado en esta partida.');
      const p = P(pid);
      state.chaos = { used: true, active: true, activatorId: pid, startDist: p.dist, endDist: p.dist + S.chaos.lapDistance };
      state.turn.step = 'resolving';
      const t0 = now();
      state.pending = { type: 'chaosIntro', playerId: pid, origin, startedAt: t0, total: S.chaosIntroMs, deadline: t0 + S.chaosIntroMs };
      announce({ kind: 'chaos', icon: Data.WIZARD.icon, title: '¡MODO CAOS!', text: Data.WIZARD.name + ' desata el caos. ' + p.name + ' lo mantendrá hasta completar una vuelta.', until: t0 + S.chaosIntroMs });
      log('🌀 ¡MODO CAOS! Retos más duros, premios mayores, tesoros dobles y tienda rebajada.', { kind: 'chaos' });
      return undefined;
    }

    /* ------------------------------ temporizadores ------------------------------ */
    function onDeadline(pd) {
      const t = now();
      if (pd.type === 'challenge') {
        if (QUESTION_KINDS.includes(pd.kind)) {
          if (pd.status === 'answering') return failChallenge(pd, 'timeout');
          return closeAvalanche(null);
        }
        if (pd.kind === 'memory') {
          if (pd.phase === 'show') { pd.phase = 'input'; pd.total = pd.inputMs; pd.startedAt = t; pd.deadline = t + pd.inputMs; return; }
          return failChallenge(pd, 'timeout');
        }
        if (pd.kind === 'draw') {
          if (pd.phase === 'draw') { toGuessPhase(pd); return; }
          return closeDraw(null);
        }
      }
      if (pd.type === 'collective') return closeCollective();
      if (pd.type === 'shield') return resolveShield(true);          // si no decide, se usa el escudo
      if (pd.type === 'shop') return finishInteraction(pd.origin);
      if (pd.type === 'chaosIntro') return finishInteraction(pd.origin);
      if (pd.type === 'roulette') {
        if (pd.status === 'ready') return doSpin();
        return finishRoulette();
      }
    }
    function toGuessPhase(pd) {
      const t = now();
      pd.phase = 'guess'; pd.total = pd.guessMs; pd.startedAt = t; pd.deadline = t + pd.guessMs;
      log('🎨 ¡' + P(pd.playerId).name + ' terminó de dibujar! A adivinar.', { kind: 'event' });
    }
    function runSched(s) {
      if (s.kind === 'afterMove') {
        const p = cur();
        if (p.dist >= S.goalDistance) return winGame(p.id);
        return landOnTile(p);
      }
      if (s.kind === 'endTurn') return finishTurn();
    }
    function tick(t) {
      if (t != null) clock = (function (v) { return () => v; })(t);
      let changed = false;
      for (let i = 0; i < 6; i++) {
        if (state.phase !== 'playing') break;
        const tt = now();
        const pd = state.pending;
        if (pd && pd.deadline && tt >= pd.deadline) { onDeadline(pd); changed = true; continue; }
        if (!pd && state.sched && tt >= state.sched.at) {
          const s = state.sched; state.sched = null; runSched(s); changed = true; continue;
        }
        break;
      }
      if (changed) dirtyEmit();
      return changed;
    }

    /* ------------------------------ permisos (los calcula el motor) ------------------------------ */
    const isIdle = () => state.phase === 'playing' && !state.pending && !state.sched && state.turn && state.turn.step === 'roll';
    function canUseItem(p, key) {
      if (state.phase !== 'playing') return { ok: false, reason: 'La partida no está en marcha.' };
      if (itemCount(p, key) <= 0) return { ok: false, reason: 'No tienes ninguno.' };
      const mine = state.turn && state.turn.playerId === p.id;
      const pd = state.pending;
      if (key === 'shield') return { ok: false, reason: 'Se ofrece solo cuando te lanzan una maldición.' };
      if (key === 'hint') {
        if (pd && pd.type === 'challenge' && pd.playerId === p.id && pd.status === 'answering' && QUESTION_KINDS.includes(pd.kind)) {
          if (pd.hintUsed) return { ok: false, reason: 'Ya usaste una pista en este reto.' };
          return { ok: true };
        }
        return { ok: false, reason: 'Solo durante tu pregunta.' };
      }
      if (!mine || !isIdle()) return { ok: false, reason: 'Solo en tu turno, antes de tirar el dado.' };
      if (key === 'extraRoll') {
        if (state.turn.isExtra) return { ok: false, reason: 'No se puede encadenar una tirada extra.' };
        if (hasEffect(p, 'extraRoll')) return { ok: false, reason: 'Ya tienes una tirada extra preparada.' };
      }
      if ((key === 'hourglass' || key === 'luckyCoin') && hasEffect(p, key)) return { ok: false, reason: 'Ya está activo.' };
      return { ok: true };
    }
    function cardTargets(pid) {
      return state.players.filter(o => o.id !== pid).map(o => ({ id: o.id, ok: !hasEffect(o, 'immune'), reason: hasEffect(o, 'immune') ? 'En periodo de respiro' : '' }));
    }
    function canPlayCard(p) {
      if (!(state.turn && state.turn.playerId === p.id && isIdle())) return { ok: false, reason: 'Solo en tu turno, antes de tirar el dado.' };
      if (state.turn.cardPlayed) return { ok: false, reason: 'Solo una carta por turno.' };
      return { ok: true };
    }
    function perms(pid) {
      const p = P(pid);
      if (!p) return {};
      const pd = state.pending;
      const mine = state.turn && state.turn.playerId === pid;
      const out = { roll: !!(mine && isIdle()), shop: shopStatus(pid), card: canPlayCard(p), targets: cardTargets(pid), items: {} };
      Object.keys(Data.SHOP_BY_KEY).forEach(k => { if (Data.SHOP_BY_KEY[k].kind === 'item') out.items[k] = canUseItem(p, k); });
      out.buy = {};
      Data.SHOP.forEach(s => { out.buy[s.key] = buyCheck(pid, s.key); });
      out.answer = false; out.pass = false; out.spin = false; out.shield = false; out.shopDone = false;
      out.drawing = false; out.guess = false; out.memoryInput = false; out.collective = false;
      if (pd && state.phase === 'playing') {
        if (pd.type === 'challenge' && QUESTION_KINDS.includes(pd.kind)) {
          if (pd.status === 'answering') { out.answer = pd.playerId === pid; out.pass = out.answer && PASSABLE.includes(pd.kind); }
          else out.answer = !pd.excluded.includes(pid) && !pd.eliminated.includes(pid);
        }
        if (pd.type === 'challenge' && pd.kind === 'memory') out.memoryInput = pd.playerId === pid && pd.phase === 'input';
        if (pd.type === 'challenge' && pd.kind === 'draw') {
          out.drawing = pd.playerId === pid && pd.phase === 'draw';
          out.guess = pd.playerId !== pid && pd.phase === 'guess' && (pd.guesses[pid] || 0) < S.drawGuessMax;
        }
        if (pd.type === 'collective') out.collective = !pd.answers[pid];
        if (pd.type === 'roulette') out.spin = pd.playerId === pid && pd.status === 'ready';
        if (pd.type === 'shield') out.shield = pd.playerId === pid;
        if (pd.type === 'shop') out.shopDone = pd.playerId === pid;
      }
      return out;
    }

    /* ------------------------------ vista por espectador ------------------------------ */
    function getView(viewer) {
      const s = clone(state);
      const full = viewer === 'dev' && allowDev;
      delete s.usedQ; delete s.sched;
      if (!full) delete s.forcedDice;
      if (s.pending && !full) {
        const pd = s.pending, sec = pd.secret || {};
        delete pd.secret;
        if (pd.type === 'challenge') {
          if (pd.kind === 'memory' && pd.phase === 'show') pd.q.seq = sec.seq;
          if (pd.kind === 'draw') {
            if (viewer === pd.playerId) pd.myWord = sec.word;
            if (viewer !== 'tv') { pd.strokeCount = pd.strokes.length; delete pd.strokes; }
          }
        }
        if (pd.type === 'collective') {
          const answered = {};
          Object.keys(pd.answers).forEach(k => { answered[k] = true; });
          pd.answered = answered; delete pd.answers;
        }
      }
      if (!full) {
        s.players.forEach(p => {
          if (p.id !== viewer) {
            p.itemCount = Object.keys(p.items).reduce((a, k) => a + p.items[k], 0);
            p.cardCount = p.cards.length;
            p.items = {}; p.cards = [];
          }
        });
      }
      s.cfg = { goalDistance: S.goalDistance, boardSize: S.boardSize, avalancheReward: S.avalancheReward, avalancheSeconds: S.avalancheSeconds,
        maxHandCards: S.maxHandCards, jackpotStart: S.jackpot.start, minPlayers: S.minPlayers, maxPlayers: S.maxPlayers,
        collectiveReward: S.collectiveReward, collectivePenalty: S.collectivePenalty, drawGuessMax: S.drawGuessMax };
      s.catalog = Data.SHOP.map(x => Object.assign({}, x, { price: priceOf(x.key), basePrice: x.price, stock: state.shopStock[x.key] }));
      s.serverNow = now();
      s.viewer = viewer;
      if (state.players.some(p => p.id === viewer)) s.me = Object.assign({ id: viewer }, perms(viewer));
      if (state.phase === 'ended') {
        s.ranking = state.players.slice().sort((a, b) => b.dist - a.dist || b.coins - a.coins).map(p => ({ id: p.id, name: p.name, dist: p.dist, coins: p.coins, avatar: p.avatar, color: p.color }));
      }
      return s;
    }

    /* ------------------------------ acciones ------------------------------ */
    const H = {};
    const isHost = a => a === 'host' || a === 'dev';

    H.addPlayer = (actor, a) => {
      if (!isHost(actor)) return err('Solo la pantalla principal puede añadir jugadores.');
      if (state.phase !== 'lobby') return err('La partida ya ha empezado.');
      if (state.players.length >= S.maxPlayers) return err('Máximo ' + S.maxPlayers + ' jugadores.');
      const p = makePlayer(a.name);
      state.players.push(p);
      return { id: p.id };
    };
    H.removePlayer = (actor, a) => {
      if (!isHost(actor)) return err('No permitido.');
      if (state.phase !== 'lobby') return err('Solo se puede quitar jugadores en el lobby.');
      state.players = state.players.filter(p => p.id !== a.id);
    };
    H.rename = (actor, a) => {
      const id = a.id || actor;
      if (!isHost(actor) && actor !== id) return err('Solo puedes cambiar tu propio nombre.');
      const p = P(id); if (!p) return err('Jugador desconocido.');
      const n = String(a.name || '').trim().slice(0, 14);
      if (!n) return err('El nombre no puede estar vacío.');
      p.name = n;
    };
    H.startGame = actor => {
      if (!isHost(actor)) return err('Solo la pantalla principal puede empezar.');
      if (state.phase !== 'lobby') return err('La partida ya está en marcha.');
      if (state.players.length < S.minPlayers) return err('Hacen falta al menos ' + S.minPlayers + ' jugadores.');
      state.phase = 'playing'; state.round = 1; state.turn = null;
      log('🎲 ¡Empieza la aventura! Meta: casilla ' + S.goalDistance + '.', { kind: 'turn' });
      startTurn(0, false);
    };
    function resetGame(autostart, keepNames) {
      const old = state.players.map(p => ({ id: p.id, name: p.name, lookIdx: p.lookIdx }));
      const pseq = state.playerSeq;
      state = freshState();
      state.playerSeq = pseq;
      old.forEach(o => { state.players.push(makePlayer(o.name, o.id, o.lookIdx)); });
      state.playerSeq = pseq;
      if (autostart) H.startGame('host');
      else log('Nueva partida preparada.');
    }
    H.resetGame = (actor, a) => {
      if (!isHost(actor)) return err('Solo la pantalla principal puede reiniciar.');
      resetGame(!!(a && a.autostart));
    };
    H.roll = actor => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      if (state.turn.playerId !== actor) return err('No es tu turno.');
      if (state.pending || state.sched || state.turn.step !== 'roll') return err('Ahora no puedes tirar el dado.');
      doRoll(cur());
    };
    H.answer = (actor, a) => {
      const pd = state.pending;
      if (!pd) return err('No hay nada que responder.');
      if (!P(actor)) return err('Jugador desconocido.');
      if (pd.type === 'collective') {
        if (pd.answers[actor]) return err('Ya has respondido.');
        const ok = isCorrect(pd, a.value);
        if (ok === undefined) return err('Respuesta no válida.');
        pd.answers[actor] = { correct: ok };
        log('👥 ' + P(actor).name + ' ha respondido.');
        if (state.players.every(p => pd.answers[p.id])) closeCollective();
        return;
      }
      if (pd.type !== 'challenge' || !QUESTION_KINDS.includes(pd.kind)) return err('Ahora no hay pregunta.');
      if (pd.status === 'answering') {
        if (actor !== pd.playerId) return err('No es tu reto.');
        const ok = isCorrect(pd, a.value);
        if (ok === undefined) return err('Respuesta no válida.');
        return ok ? winChallenge(pd) : failChallenge(pd, 'wrong');
      }
      if (pd.excluded.includes(actor)) return err('Pasaste esta pregunta: no puedes responder.');
      if (pd.eliminated.includes(actor)) return err('Ya has fallado esta pregunta.');
      const ok = isCorrect(pd, a.value);
      if (ok === undefined) return err('Respuesta no válida.');
      if (ok) return closeAvalanche(actor);
      pd.eliminated.push(actor);
      log('🏔️ ' + P(actor).name + ' falla y queda fuera de la Avalancha.', { kind: 'bad' });
      const left = state.players.filter(p => !pd.excluded.includes(p.id) && !pd.eliminated.includes(p.id));
      if (!left.length) closeAvalanche(null);
    };
    H.pass = actor => {
      const pd = state.pending;
      if (!pd || pd.type !== 'challenge' || pd.status !== 'answering' || !QUESTION_KINDS.includes(pd.kind)) return err('Ahora no puedes pasar.');
      if (actor !== pd.playerId) return err('No es tu reto.');
      if (!PASSABLE.includes(pd.kind)) return err('Este reto no se puede pasar.');
      passToAvalanche(pd, P(actor));
    };
    H.submitMemory = (actor, a) => {
      const pd = state.pending;
      if (!pd || pd.type !== 'challenge' || pd.kind !== 'memory' || pd.phase !== 'input') return err('Ahora no puedes responder.');
      if (actor !== pd.playerId) return err('No es tu reto.');
      if (!Array.isArray(a.seq) || a.seq.length !== pd.secret.seq.length) return err('Secuencia incompleta.');
      const ok = a.seq.every((x, i) => x === pd.secret.seq[i]);
      return ok ? winChallenge(pd) : failChallenge(pd, 'wrong');
    };
    H.drawUpdate = (actor, a) => {
      const pd = state.pending;
      if (!pd || pd.type !== 'challenge' || pd.kind !== 'draw' || pd.phase !== 'draw' || actor !== pd.playerId) return err('Ahora no puedes dibujar.');
      const st = sanitizeStrokes(a.strokes); if (!st) return err('Dibujo no válido.');
      pd.strokes = st;
    };
    H.drawFinish = (actor, a) => {
      const pd = state.pending;
      if (!pd || pd.type !== 'challenge' || pd.kind !== 'draw' || pd.phase !== 'draw' || actor !== pd.playerId) return err('Ahora no puedes terminar el dibujo.');
      if (a && a.strokes) { const st = sanitizeStrokes(a.strokes); if (st) pd.strokes = st; }
      if (!pd.strokes.length) return err('Dibuja algo antes de terminar.');
      toGuessPhase(pd);
    };
    H.guess = (actor, a) => {
      const pd = state.pending;
      if (!pd || pd.type !== 'challenge' || pd.kind !== 'draw' || pd.phase !== 'guess') return err('Ahora no se puede adivinar.');
      if (!P(actor) || actor === pd.playerId) return err('El dibujante no puede adivinar.');
      if ((pd.guesses[actor] || 0) >= S.drawGuessMax) return err('Ya no te quedan intentos.');
      const n = Data.normalize(a.text);
      if (!n) return err('Escribe una palabra.');
      pd.guesses[actor] = (pd.guesses[actor] || 0) + 1;
      const ok = [pd.secret.word].concat(pd.secret.alts || []).some(w => Data.normalize(w) === n);
      if (ok) return closeDraw(actor);
      log('🎨 ' + P(actor).name + ' lo intenta: «' + String(a.text).slice(0, 20) + '».');
      const guessers = state.players.filter(p => p.id !== pd.playerId);
      if (guessers.every(g => (pd.guesses[g.id] || 0) >= S.drawGuessMax)) closeDraw(null);
    };
    H.buy = (actor, a) => {
      const chk = buyCheck(actor, a.key);
      if (!chk.ok) return err(chk.reason);
      const p = P(actor), def = Data.SHOP_BY_KEY[a.key], price = priceOf(a.key);
      p.coins -= price; p.stats.spent += price;
      state.shopStock[a.key]--;
      grantItem(p, a.key, true);
      state.jackpot += S.jackpot.onPurchase;
      log('🛒 ' + p.name + ' compra ' + def.name + ' (−' + price + ' 🪙, bote +' + S.jackpot.onPurchase + ').', { kind: 'shop' });
    };
    H.shopDone = actor => {
      const pd = state.pending;
      if (!pd || pd.type !== 'shop' || pd.playerId !== actor) return err('No estás en la tienda.');
      finishInteraction(pd.origin);
    };
    H.useItem = (actor, a) => {
      const p = P(actor); if (!p) return err('Jugador desconocido.');
      const chk = canUseItem(p, a.key);
      if (!chk.ok) return err(chk.reason);
      const consume = () => { p.items[a.key]--; if (p.items[a.key] <= 0) delete p.items[a.key]; };
      if (a.key === 'hint') {
        const pd = state.pending;
        consume(); pd.hintUsed = true;
        if (pd.q.type === 'choice') {
          const wrong = pd.q.options.map((o, i) => i).filter(i => i !== pd.secret.correctIdx);
          pd.hidden = shuffle(wrong).slice(0, 2);
        } else {
          const core = pd.secret.answers[0].replace(/^(El |La |Los |Las |Un |Una )/, '');
          pd.hintText = 'Empieza por «' + core.charAt(0).toUpperCase() + '» · ' + core.replace(/\s/g, '').length + ' letras';
        }
        log('💡 ' + p.name + ' usa una pista.');
        return;
      }
      consume();
      if (a.key === 'extraRoll') addEffect(p, 'extraRoll');
      if (a.key === 'hourglass') addEffect(p, 'hourglass');
      if (a.key === 'luckyCoin') addEffect(p, 'luckyCoin');
      log(Data.SHOP_BY_KEY[a.key].icon + ' ' + p.name + ' usa ' + Data.SHOP_BY_KEY[a.key].name + '.');
    };
    H.playCard = (actor, a) => {
      const p = P(actor); if (!p) return err('Jugador desconocido.');
      const chk = canPlayCard(p); if (!chk.ok) return err(chk.reason);
      const idx = Number(a.index);
      if (!Number.isInteger(idx) || idx < 0 || idx >= p.cards.length) return err('Esa carta no existe.');
      const key = p.cards[idx];
      const def = Data.SHOP_BY_KEY[key];
      if (def.type === 'defense') {
        if (hasEffect(p, key)) return err('Ya tienes esa defensa activa.');
        p.cards.splice(idx, 1); state.turn.cardPlayed = true;
        addEffect(p, key);
        log(def.icon + ' ' + p.name + ' activa ' + def.name + '.', { kind: 'card' });
        return;
      }
      const t = P(a.targetId);
      if (!t || t.id === actor) return err('Elige a un rival.');
      if (hasEffect(t, 'immune')) return err(t.name + ' está en periodo de respiro: no se le puede atacar con cartas.');
      p.cards.splice(idx, 1); state.turn.cardPlayed = true;
      if (hasEffect(t, 'mirror')) {                 // el reflejo no se puede volver a reflejar ni anular
        takeEffect(t, 'mirror');
        addEffect(p, key);
        addEffect(t, 'immune');
        log('🪞 ' + t.name + ' refleja ' + def.name + ' de vuelta contra ' + p.name + '.', { kind: 'card' });
        setResult({ kind: 'card', ok: false, playerId: p.id, title: '🪞 ¡Reflejado!', text: def.name + ' vuelve contra ' + p.name });
      } else if (hasEffect(t, 'ward')) {
        takeEffect(t, 'ward');
        addEffect(t, 'immune');
        log('🧿 El amuleto de ' + t.name + ' anula ' + def.name + ' de ' + p.name + '.', { kind: 'card' });
        setResult({ kind: 'card', ok: false, playerId: t.id, title: '🧿 ¡Ataque anulado!', text: t.name + ' se protege de ' + def.name });
      } else {
        addEffect(t, key);
        addEffect(t, 'immune');
        log(def.icon + ' ' + p.name + ' lanza ' + def.name + ' contra ' + t.name + '.', { kind: 'card' });
        setResult({ kind: 'card', ok: true, playerId: t.id, title: def.icon + ' ' + def.name, text: p.name + ' ataca a ' + t.name });
      }
    };
    H.spin = actor => {
      const pd = state.pending;
      if (!pd || pd.type !== 'roulette' || pd.status !== 'ready' || pd.playerId !== actor) return err('No puedes girar la ruleta ahora.');
      doSpin();
    };
    H.useShield = actor => {
      const pd = state.pending;
      if (!pd || pd.type !== 'shield' || pd.playerId !== actor) return err('No hay maldición que bloquear.');
      resolveShield(true);
    };
    H.declineShield = actor => {
      const pd = state.pending;
      if (!pd || pd.type !== 'shield' || pd.playerId !== actor) return err('No hay maldición que aceptar.');
      resolveShield(false);
    };

    /* ----- herramientas de desarrollador (solo actor 'dev') ----- */
    const D = {};
    const needIdle = () => (isIdle() ? null : err('Hay una interacción en marcha. Ciérrala o usa «Saltar interacción».'));
    D.devSetCoins = (a) => { const p = P(a.playerId); if (!p) return err('Jugador desconocido.'); p.coins = Math.max(0, Math.floor(Number(a.coins) || 0)); };
    D.devAddCoins = (a) => { const p = P(a.playerId); if (!p) return err('Jugador desconocido.'); p.coins = Math.max(0, p.coins + Math.floor(Number(a.delta) || 0)); };
    D.devGiveItem = (a) => {
      const p = P(a.playerId); if (!p || !Data.SHOP_BY_KEY[a.key]) return err('Datos no válidos.');
      for (let i = 0; i < (a.qty || 1); i++) grantItem(p, a.key, true);
    };
    D.devTeleport = (a) => {
      const p = P(a.playerId); if (!p) return err('Jugador desconocido.');
      teleport(p, Math.max(0, Math.min(S.goalDistance, Math.floor(Number(a.dist) || 0))), 'teleport');
    };
    D.devForceDice = (a) => { const v = Math.floor(Number(a.value)); if (!(v >= 1 && v <= 6)) return err('Valor 1-6.'); state.forcedDice = v; };
    D.devAvalanche = () => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      const e = needIdle(); if (e) return e;
      startChallenge(state.turn.playerId, { origin: 'dev', kind: 'choice', avalanche: true });
    };
    D.devChallenge = (a) => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      const e = needIdle(); if (e) return e;
      startChallenge(state.turn.playerId, { origin: 'dev', kind: a.kind || 'choice' });
    };
    D.devRoulette = (a) => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      const e = needIdle(); if (e) return e;
      startRoulette(a.playerId || state.turn.playerId, 'dev');
    };
    D.devShop = () => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      const e = needIdle(); if (e) return e;
      openShop(state.turn.playerId, 'dev');
    };
    D.devCollective = () => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      const e = needIdle(); if (e) return e;
      startCollective('dev');
    };
    D.devCurse = (a) => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      const e = needIdle(); if (e) return e;
      if (!Data.CURSE_BY_ID[a.curseId]) return err('Maldición desconocida.');
      const targets = a.targetId === 'all' ? state.players : [P(a.targetId || state.turn.playerId)];
      if (targets.some(t => !t)) return err('Objetivo desconocido.');
      startCurses(targets.map(t => ({ curseId: a.curseId, targetId: t.id, sourceId: state.turn.playerId })), 'dev');
    };
    D.devChaos = () => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      const e = needIdle(); if (e) return e;
      return startChaos(state.turn.playerId, 'dev');
    };
    D.devSkipTurn = () => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      state.pending = null; state.sched = null;
      finishTurn();
    };
    D.devSkipInteraction = () => {
      if (state.phase !== 'playing') return err('La partida no está en marcha.');
      state.pending = null; state.sched = null; state.turn.step = 'roll';
    };
    D.devSetup = (a) => {
      const n = Math.max(2, Math.min(S.maxPlayers, Math.floor(Number(a.count) || 3)));
      state = freshState();
      for (let i = 0; i < n; i++) state.players.push(makePlayer(Data.TEST_NAMES[i], 'p' + (i + 1), i));
      state.playerSeq = n;
      if (a.start !== false) H.startGame('host');
    };
    D.devSetting = (a) => {
      const allowed = ['goalDistance', 'avalancheReward', 'avalancheSeconds', 'startCoins', 'coinTileReward'];
      if (!allowed.includes(a.key)) return err('Ajuste no editable.');
      const v = Number(a.value); if (!isFinite(v) || v < 0) return err('Valor no válido.');
      S[a.key] = v;
    };

    function dispatch(actor, action) {
      try {
        if (!action || typeof action.type !== 'string') return { ok: false, error: 'Acción no válida.' };
        let r;
        if (action.type.indexOf('dev') === 0) {
          if (!allowDev || actor !== 'dev') return { ok: false, error: 'Las herramientas de desarrollador no están disponibles.' };
          const f = D[action.type];
          if (!f) return { ok: false, error: 'Acción de desarrollador desconocida.' };
          r = f(action);
        } else {
          const f = H[action.type];
          if (!f) return { ok: false, error: 'Acción desconocida.' };
          r = f(actor, action);
        }
        if (r && r.error) return { ok: false, error: r.error };
        dirtyEmit();
        return Object.assign({ ok: true }, r || {});
      } catch (e) {
        console.error(e);
        return { ok: false, error: 'Error interno: ' + e.message };
      }
    }

    return {
      dispatch, tick, getView,
      subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
      getState: () => state,                // solo para pruebas y depuración
      settings: S,
      setClock(fn) { clock = fn; },
      Data
    };
  }

  return { createEngine };
});

  const store = {
    get(k, def) { try { const v = localStorage.getItem('te.' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem('te.' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
  };

  /* ----- reloj sincronizado con el estado (serverNow - Date.now()) ----- */
  let clockOffset = 0;
  const setClockFrom = view => { if (view && view.serverNow) clockOffset = view.serverNow - Date.now(); };
  const now = () => Date.now() + clockOffset;

  /* ----- temporizadores visuales: cualquier .timer-bar con data-deadline/data-total ----- */
  function updateTimers() {
    const t = now();
    document.querySelectorAll('.timer-bar[data-deadline]').forEach(el => {
      const dl = Number(el.dataset.deadline), total = Number(el.dataset.total) || 1;
      const left = Math.max(0, dl - t);
      el.style.transform = 'scaleX(' + Math.min(1, left / total).toFixed(4) + ')';
      el.classList.toggle('low', left / total < 0.25);
    });
    document.querySelectorAll('.timer-num[data-deadline]').forEach(el => {
      const left = Math.max(0, Number(el.dataset.deadline) - t);
      const s = Math.ceil(left / 1000);
      if (el.textContent !== String(s)) el.textContent = s;
    });
  }
  let timerHandle = null;
  function startTimers() {
    if (timerHandle) return;
    timerHandle = setInterval(updateTimers, 100);

    '<div class="c-timer ' + (extra || '') + '"><div class="timer-track"><div class="timer-bar" data-deadline="' + pd.deadline + '" data-total="' + pd.total + '"></div></div>' +
    '<b class="timer-num" data-deadline="' + pd.deadline + '"></b></div>';

  const PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };

  /* ----- dibujo ----- */
  function drawStrokes(canvas, strokes) {
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const k = canvas.width / 1000;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    (strokes || []).forEach(s => {
      ctx.strokeStyle = s.e ? '#ffffff' : s.c;
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = s.w * k;
      const p = s.p;
      if (!p.length) return;
      if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0] * k, p[0][1] * k, s.w * k / 2, 0, 7); ctx.fill(); return; }
      ctx.beginPath(); ctx.moveTo(p[0][0] * k, p[0][1] * k);
      for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0] * k, p[i][1] * k);

  function effectChips(p) {
    return (p.effects || []).filter(e => e.type !== 'immune' || true).map(e => {
      const d = D.EFFECTS[e.type]; if (!d) return '';
      return '<span class="chip fx" title="' + esc(d.name + ': ' + d.text) + '">' + d.icon + '</span>';
    }).join('');
  }

  TE.UI = { esc, store, now, setClockFrom, startTimers, updateTimers, timerHTML, dieHTML, setDieValue, drawStrokes, catBadge, diffDots,
    KIND_NAME, OPT_LETTERS, playerById, effectChips, PIPS };
})();

   audio.js — Sonidos sintetizados con WebAudio (sin archivos, sin Internet)

(function () {

  const sounds = {
    click: () => tone(660, 0.06, { type: 'triangle', vol: 0.15 }),
    dice: () => { for (let i = 0; i < 7; i++) tone(180 + Math.random() * 200, 0.05, { type: 'square', vol: 0.1, delay: i * 0.12 }); },
    step: () => tone(300, 0.07, { type: 'triangle', vol: 0.12, to: 380 }),
    coin: () => seq([988, 1319], 0.08, { type: 'square', vol: 0.14, dur: 0.12 }),
    good: () => seq([523, 659, 784], 0.1, { type: 'triangle', vol: 0.22 }),
    bad: () => seq([300, 220], 0.14, { type: 'sawtooth', vol: 0.15, dur: 0.22 }),
    curse: () => { tone(160, 0.8, { type: 'sawtooth', vol: 0.16, to: 70 }); tone(190, 0.8, { type: 'square', vol: 0.08, to: 90, delay: 0.05 }); },

    chaos: () => { tone(120, 1.8, { type: 'sawtooth', vol: 0.2, to: 40 }); seq([392, 370, 349, 330, 311], 0.18, { type: 'square', vol: 0.1, dur: 0.3 }); },

/* ==========================================================================
   windows.js — Ventanas flotantes (arrastrar, redimensionar, minimizar,
   ampliar, cerrar y reabrir). Se usan para los móviles simulados y el panel
   de desarrollador. Viven en #float-layer, por encima de la TV, y nunca
   alteran el diseño del tablero.
   ========================================================================== */
(function () {
  'use strict';
  const TE = (window.TE = window.TE || {});
  let zTop = 1000;
  const all = [];

  function FloatingWindow(opts) {
    const layer = document.getElementById('float-layer');
    const el = document.createElement('div');
    el.className = 'fw ' + (opts.className || '');
    el.innerHTML =
      '<div class="fw-bar"><span class="fw-title"></span>' +
      '<span class="fw-btns"><button type="button" data-w="min" title="Minimizar / restaurar" aria-label="Minimizar">–</button>' +
      '<button type="button" data-w="max" title="Ampliar / reducir" aria-label="Ampliar">▢</button>' +
      '<button type="button" data-w="close" title="Cerrar" aria-label="Cerrar">✕</button></span></div>' +
      '<div class="fw-body"></div><div class="fw-grip" title="Arrastra para cambiar el tamaño"></div>';
    layer.appendChild(el);
    const bar = el.querySelector('.fw-bar'), body = el.querySelector('.fw-body'), grip = el.querySelector('.fw-grip');
    el.querySelector('.fw-title').innerHTML = opts.title || '';

    const minW = opts.minW || 220, minH = opts.minH || 240;
    const s = { x: opts.x || 40, y: opts.y || 40, w: opts.w || 300, h: opts.h || 560, min: false, max: false, prev: null, open: false };
    const api = { el, body, state: s };

    function clamp() {
      const vw = window.innerWidth, vh = window.innerHeight;
      s.w = Math.max(minW, Math.min(s.w, vw));
      s.h = Math.max(minH, Math.min(s.h, vh));
      s.x = Math.max(-s.w + 90, Math.min(s.x, vw - 90));
      s.y = Math.max(0, Math.min(s.y, vh - 36));
    }
    function apply() {
      clamp();
      el.style.left = s.x + 'px'; el.style.top = s.y + 'px'; el.style.width = s.w + 'px';
      el.style.height = s.min ? 'auto' : s.h + 'px';
      el.classList.toggle('min', s.min); el.classList.toggle('max', s.max);
